name: Ovozim APK

on:
  push:
    branches: [main, claude/ovoz-ilova]
    paths: ['ovoz/**', '.github/workflows/ovoz.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ovoz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Kutubxonalar
        run: npm install --no-audit --no-fund
      - name: Android loyiha
        run: |
          npx cap add android
          npx cap sync android
      - name: Mikrofon ruxsati
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' $M
          grep -q RECORD_AUDIO $M
      - name: Ikonka va splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#101418' --splashBackgroundColor '#101418' || echo "Ikonka yaratilmadi"
      - name: Versiya
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: APK yig'ish
        working-directory: ovoz/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Imzolash
        env:
          KS_PASS: 2428100b6cb0e76f23824b47c7fbcdb0
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ../signing/lazer.jks --ks-key-alias lazer --ks-pass env:KS_PASS --key-pass env:KS_PASS --out ovozim.apk aligned.apk
          $BT/apksigner verify ovozim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ovozim-apk
          path: ovoz/ovozim.apk
      # Lazer ilovasi "releases/latest" ni tekshiradi, shuning uchun bu reliz hech qachon "latest" bo'lmasin
      - name: Releases (latest emas)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ovozim-v1.0.${{ github.run_number }}
          name: Ovozim 1.0.${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: ovoz/ovozim.apk
