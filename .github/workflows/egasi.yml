name: Egasi versiyasi (aktivatsiyasiz)

on:
  push:
    branches: [egasi]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aktivatsiyani o'chirish
        run: |
          grep -q 'async function licInit(){if(!isNative()){' www/index.html
          sed -i 's/async function licInit(){if(!isNative()){/async function licInit(){if(true){/' www/index.html

      - name: Kutubxonalarni o'rnatish
        run: npm install --no-audit --no-fund

      - name: Android loyihasini yaratish
        run: |
          npx cap add android
          npx cap sync android

      - name: Ikonka va splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0e1214' --splashBackgroundColor '#0e1214' || echo "Ikonka yaratilmadi"

      - name: Versiya raqami
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $((3000 + ${{ github.run_number }}))/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"egasi-${{ github.run_number }}\"/" android/app/build.gradle

      - name: Egasi versiyasi (aktivatsiyasiz)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Doimiy kalit bilan imzolash
        env:
          KS_PASS: 2428100b6cb0e76f23824b47c7fbcdb0
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks signing/lazer.jks --ks-key-alias lazer --ks-pass env:KS_PASS --key-pass env:KS_PASS --out lazer.apk aligned.apk
          $BT/apksigner verify --print-certs lazer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lazer-egasi
          path: lazer.apk

      - name: Yopiq qoralama (draft) — faqat egasi ko'radi
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lazer-egasi-${{ github.run_number }}
          name: "EGASI — Lazer ${{ github.run_number }} (maxfiy)"
          draft: true
          files: lazer.apk
