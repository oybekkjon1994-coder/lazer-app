name: Jarvis APK

on:
  push:
    branches: [main]
    paths: ['jarvis/**', 'jarvis-xabar/**', 'catalog/www/dxf/**', 'catalog/www/items.js', '.github/workflows/jarvis.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Katalog naqshlarini qo'shish
        run: |
          mkdir -p jarvis/app/src/main/assets/lib
          cp catalog/www/dxf/*.dxz jarvis/app/src/main/assets/lib/
          cp catalog/www/items.js catalog/www/inflate.js jarvis/app/src/main/assets/lib/
          ls jarvis/app/src/main/assets/lib | wc -l
      - name: APK yig'ish
        env:
          RUN: ${{ github.run_number }}
        run: gradle -p jarvis assembleRelease --no-daemon
      - name: Doimiy kalit bilan imzolash
        env:
          KS_PASS: 2428100b6cb0e76f23824b47c7fbcdb0
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 jarvis/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks signing/lazer.jks --ks-key-alias lazer --ks-pass env:KS_PASS --key-pass env:KS_PASS --out jarvis.apk aligned.apk
          $BT/apksigner verify --print-certs jarvis.apk
      - name: Jarvis Xabar APK
        env:
          RUN: ${{ github.run_number }}
          KS_PASS: 2428100b6cb0e76f23824b47c7fbcdb0
        run: |
          gradle -p jarvis-xabar assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 jarvis-xabar/app/build/outputs/apk/release/app-release-unsigned.apk aligned2.apk
          $BT/apksigner sign --ks signing/lazer.jks --ks-key-alias lazer --ks-pass env:KS_PASS --key-pass env:KS_PASS --out jarvis-xabar.apk aligned2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis.apk
      - name: Releases sahifasiga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-1.0.${{ github.run_number }}
          name: Jarvis ${{ github.run_number }}
          files: |
            jarvis.apk
            jarvis-xabar.apk
