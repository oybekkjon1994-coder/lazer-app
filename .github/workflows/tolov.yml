name: Lazer To'lov APK

on:
  push:
    branches: [main]
    paths: ['tolov/**', '.github/workflows/tolov.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK yig'ish
        env:
          RUN: ${{ github.run_number }}
        run: gradle -p tolov assembleDebug --no-daemon
      - run: cp tolov/app/build/outputs/apk/debug/app-debug.apk lazer-tolov.apk
      - name: Releases sahifasiga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tolov-${{ github.run_number }}
          name: Lazer To'lov ${{ github.run_number }}
          files: lazer-tolov.apk
