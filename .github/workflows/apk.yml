name: APK yig'ish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Kutubxonalarni o'rnatish
        run: npm install --no-audit --no-fund

      - name: Android loyihasini yaratish
        run: |
          npx cap add android
          npx cap sync android

      - name: Ikonka va splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0e1214' --splashBackgroundColor '#0e1214' || echo "Ikonka yaratilmadi"

      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK nomini o'zgartirish
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lazer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lazer-apk
          path: lazer.apk

      - name: Releases sahifasiga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lazer ${{ github.run_number }}
          files: lazer.apk
