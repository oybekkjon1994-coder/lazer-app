name: Payvand Usta APK

on:
  push:
    branches: [main]
    paths: ['payvand/**', '.github/workflows/payvand.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payvand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Kutubxonalar
        run: npm install --no-audit --no-fund
      - name: Android loyiha
        run: |
          npx cap add android
          npx cap sync android
      - name: Ikonka va splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#101317' --splashBackgroundColor '#101317' || echo "Ikonka yaratilmadi"
      - name: Versiya
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: APK yig'ish
        working-directory: payvand/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Imzolash
        env:
          KS_PASS: 2428100b6cb0e76f23824b47c7fbcdb0
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ../signing/lazer.jks --ks-key-alias lazer --ks-pass env:KS_PASS --key-pass env:KS_PASS --out payvand-usta.apk aligned.apk
          $BT/apksigner verify payvand-usta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: payvand-usta-apk
          path: payvand/payvand-usta.apk
      - name: Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: payvand-v1.0.${{ github.run_number }}
          name: Payvand Usta 1.0.${{ github.run_number }}
          files: payvand/payvand-usta.apk
