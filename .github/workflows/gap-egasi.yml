name: Gap daftari — egasi (bepul Premium)

on:
  push:
    branches: [egasi]
    paths: ['gap/**', '.github/workflows/gap.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Premium'ni ochish
        run: |
          grep -q 'const PREMIUM=()=>LIC.ok;' www/index.html
          sed -i 's/const PREMIUM=()=>LIC.ok;/const PREMIUM=()=>true;/' www/index.html

      - name: Kutubxonalarni o'rnatish
        run: npm install --no-audit --no-fund

      - name: Android loyihasini yaratish
        run: |
          npx cap add android
          npx cap sync android

      - name: Joylashuv ruxsati (manifest)
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -c ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml

      - name: Ikonka va splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f7a5c' --splashBackgroundColor '#0f7a5c' || echo "Ikonka yaratilmadi"

      - name: Versiya raqami
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $((1000 + ${{ github.run_number }}))/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"egasi-${{ github.run_number }}\"/" android/app/build.gradle

      - name: Gap daftari APK
        working-directory: gap/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Doimiy kalit bilan imzolash
        env:
          KS_PASS: 2428100b6cb0e76f23824b47c7fbcdb0
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ../signing/lazer.jks --ks-key-alias lazer --ks-pass env:KS_PASS --key-pass env:KS_PASS --out gap-daftari.apk aligned.apk
          $BT/apksigner verify --print-certs gap-daftari.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gap-egasi
          path: gap/gap-daftari.apk

      - name: Yopiq qoralama (draft) — faqat egasi ko'radi
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gap-egasi-${{ github.run_number }}
          name: "EGASI — Gap daftari ${{ github.run_number }} (maxfiy)"
          draft: true
          files: gap/gap-daftari.apk
