<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>Payvand Usta</title>
<style>
:root{--bg:#101317;--card:#1a1f26;--card2:#222833;--line:#2c3440;--tx:#eef1f5;--mut:#9aa4b2;--gold:#e8b23a;--gold2:#f6d27a;--blue:#4ea3ff;--green:#3ecf8e;--red:#ff6b6b;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:96px;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#101317 70%,#10131700);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:.2px}
.logo svg{width:30px;height:30px}
.logo b{color:var(--gold)}
header .back{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;width:42px;height:42px;font-size:22px;display:none}
header .ttl{font-weight:700;font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .star{background:none;border:none;font-size:24px;color:var(--mut);display:none}
header .star.on{color:var(--gold)}
main{padding:4px 16px 16px;max-width:760px;margin:0 auto}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:12px 18px;margin:6px 0 18px}
.search input{flex:1;background:none;border:none;color:var(--tx);font-size:16px;outline:none}
h3.sec{font-size:13px;letter-spacing:3px;color:var(--mut);font-weight:600;margin:22px 4px 12px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;color:var(--tx);text-align:left;font-size:14px;font-weight:600}
.tile svg{width:28px;height:28px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px;color:var(--tx);font-size:17px;font-weight:600;text-align:left;width:100%}
.row svg{width:26px;height:26px;flex:none}
.row span{flex:1}
.row small{display:block;color:var(--mut);font-weight:400;font-size:13px;margin-top:3px}
.row .chev{color:var(--mut);font-size:20px}
.ic-q{color:var(--blue)}.ic-p{color:var(--gold)}.ic-y{color:#b48cff}.ic-m{color:var(--green)}
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:#1b2028ee;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;display:flex;justify-content:space-around;padding:6px;z-index:9;max-width:740px;margin:0 auto}
nav button{flex:1;background:none;border:none;color:var(--mut);border-radius:999px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}
nav button svg{width:24px;height:24px}
nav button.on{background:var(--tx);color:#111}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h4{margin:0 0 10px;font-size:15px;color:var(--gold2)}
.desc{color:var(--mut);font-size:14px;line-height:1.45;margin:0 0 12px}
.f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fld label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.w{grid-column:1/-1}
.fld label{font-size:13px;color:var(--mut)}
.fld .in{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.fld input,.fld select{flex:1;min-width:0;background:none;border:none;color:var(--tx);font-size:17px;padding:11px 0;outline:none}
.fld select{appearance:none;-webkit-appearance:none}
.fld select option{background:#222833}
.fld .u{color:var(--mut);font-size:13px;margin-left:6px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.seg button{flex:1;background:none;border:none;color:var(--mut);padding:9px 6px;border-radius:9px;font-size:14px;font-weight:600}
.seg button.on{background:var(--gold);color:#1a1300}
.res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.r{background:var(--card2);border-radius:14px;padding:12px}
.r.big{grid-column:1/-1;background:linear-gradient(135deg,#3a2c0c,#2a2416);border:1px solid #6b5420}
.r .l{font-size:12.5px;color:var(--mut)}
.r .v{font-size:22px;font-weight:800;margin-top:4px}
.r.big .v{font-size:30px;color:var(--gold2)}
.r .v small{font-size:13px;color:var(--mut);font-weight:600;margin-left:4px}
.note{font-size:13.5px;color:var(--mut);line-height:1.5;background:#161b21;border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;margin-top:12px}
.warn{border-left-color:var(--red);color:#ffb3b3}
.ok{border-left-color:var(--green);color:#bff3da}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--mut);font-weight:600;font-size:12.5px}
.tw{overflow-x:auto}
.svgbox{background:#0c0f13;border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:4px}
.svgbox svg{width:100%;height:auto;display:block;max-height:420px}
.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:13px;font-size:15px;font-weight:700}
.btn.p{background:var(--gold);color:#1a1300;border:none}
.toast{position:fixed;left:16px;right:16px;bottom:96px;background:#2b3340;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;z-index:20;display:none}
.compat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
.b-ok{background:#123d2a;color:var(--green)}.b-w{background:#3d3212;color:var(--gold2)}.b-no{background:#3d1717;color:var(--red)}
.foot{color:var(--mut);font-size:12px;text-align:center;margin:26px 0 6px}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
</style>
</head>
<body>
<header>
  <button class="back" id="back" aria-label="Orqaga">‹</button>
  <div class="logo" id="logo"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#1a1f26" stroke="#e8b23a" stroke-width="2"/><path d="M9 21l5-10 3 6 2-3 4 7" fill="none" stroke="#e8b23a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="10" r="2" fill="#f6d27a"/></svg><span>Payvand <b>Usta</b></span></div>
  <div class="ttl" id="ttl"></div>
  <button class="star" id="star" aria-label="Tez kirishga qo'shish">★</button>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ================= yordamchilar ================= */
const $=s=>document.querySelector(s);
const PI=Math.PI,rad=d=>d*PI/180,deg=r=>r*180/PI;
const fmt=(x,d=1)=>{if(x==null||!isFinite(x))return"—";const neg=x<0;const s=Math.abs(Math.round(x*10**d)/10**d).toFixed(d);const [i,f]=s.split(".");return(neg?"−":"")+i.replace(/\B(?=(\d{3})+(?!\d))/g," ")+(f?","+f:"")};
const fmt0=x=>fmt(x,0);
const store={get(k,d){try{const v=localStorage.getItem("pu_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("pu_"+k,JSON.stringify(v))}catch(e){}}};
function toast(t,ms=3200){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",ms)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= ikonkalar ================= */
const I={
 offset:'<path d="M5 20v-6l6-6h8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 5l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
 branch:'<circle cx="8" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2.2"/>',
 elbow:'<path d="M5 20V11a6 6 0 0 1 6-6h8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M9 20v-8a3 3 0 0 1 3-3h7" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".6"/>',
 flow:'<path d="M4 15a8 8 0 1 1 16 0" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 15l4-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
 drop:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z" fill="currentColor"/>',
 purge:'<path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 flask:'<path d="M9 3h6M10 3v6l-5 10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2l-5-10V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 rod:'<path d="M4 20L18 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M18 6l2-2" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M5 15l-2 1M8 18l-1 2M3 19l2-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
 wire:'<circle cx="9" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="12" r="2" fill="currentColor"/><path d="M15 12h6" stroke="currentColor" stroke-width="2"/>',
 tig:'<path d="M6 20l8-8M14 12l4-8 2 2-6 6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 fire:'<path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3 1-6 1-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 temp:'<path d="M10 4a2 2 0 0 1 4 0v10a4 4 0 1 1-4 0z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="17" r="2" fill="currentColor"/>',
 gauge:'<circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 13l4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
 cone:'<path d="M12 3L4 20h16z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
 hopper:'<path d="M3 5h18l-6 9v5H9v-5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
 sq2r:'<rect x="3" y="13" width="18" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="12" cy="6" rx="5" ry="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 13l4-7M21 13l-4-7" stroke="currentColor" stroke-width="1.6"/>',
 bend:'<path d="M4 20h7a5 5 0 0 0 5-5V4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
 bump:'<path d="M3 18c3 0 3-3 6-3s3 3 6 3 3-3 6-3" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="5" cy="9" r="2" fill="currentColor"/><path d="M7 9h12" stroke="currentColor" stroke-width="2"/>',
 mitre:'<path d="M4 20V4l16 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 16v-4h4" fill="none" stroke="currentColor" stroke-width="1.6"/>',
 frame:'<rect x="4" y="4" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M4 4l4 4M20 4l-4 4M4 20l4-4M20 20l-4-4" stroke="currentColor" stroke-width="1.4"/>',
 laser:'<circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
 folder:'<path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2"/>',
 weight:'<path d="M6 8h12l2 12H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/>',
 table:'<rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M3 14h18M10 4v16" stroke="currentColor" stroke-width="1.6"/>',
 conv:'<path d="M4 8h14l-3-3M20 16H6l3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
 cyl:'<ellipse cx="12" cy="6" rx="7" ry="2.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 6v12c0 1.5 3 2.6 7 2.6s7-1.1 7-2.6V6" fill="none" stroke="currentColor" stroke-width="2"/>',
 search:'<circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="currentColor"/>',
 book:'<path d="M3 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H3zM21 5h-7a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 compass:'<circle cx="12" cy="4.5" r="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 6.5L6 21M13 6.5L18 21M8 15h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
};
const ico=(k,cls="")=>`<svg viewBox="0 0 24 24" class="${cls}">${I[k]||""}</svg>`;

/* ================= bo'limlar va asboblar ================= */
const CATS=[
 {id:"home",name:"Bosh sahifa",ic:"home"},
 {id:"q",name:"Quvur",ic:"offset",cls:"ic-q",full:"Quvur ishlari"},
 {id:"p",name:"Payvand",ic:"fire",cls:"ic-p",full:"Payvand"},
 {id:"y",name:"Yoyilma",ic:"compass",cls:"ic-y",full:"Yoyilma va bukish (list metall)"},
 {id:"m",name:"Ma'lumot",ic:"book",cls:"ic-m",full:"Metall va ma'lumotnoma"},
];
const TOOLS=[];const T=o=>{TOOLS.push(o);return o};
const tool=id=>TOOLS.find(t=>t.id===id);

/* ================= forma va natija ================= */
/* fields: [{k,l,u,v,step,opts:[[val,label]],w}] */
function form(fields,vals){
  return `<div class="f">${fields.map(f=>{
    const v=vals[f.k]??f.v;
    const inner=f.opts?`<select data-k="${f.k}">${f.opts.map(o=>`<option value="${esc(o[0])}"${String(o[0])===String(v)?" selected":""}>${esc(o[1])}</option>`).join("")}</select>`
      :`<input data-k="${f.k}" type="${f.t||"number"}" inputmode="decimal" step="any" value="${esc(v)}">`;
    return `<div class="fld${f.w?" w":""}"><label>${esc(f.l)}</label><div class="in">${inner}${f.u?`<span class="u">${f.u}</span>`:""}</div></div>`}).join("")}</div>`;
}
function readVals(root,fields){const o={};fields.forEach(f=>{const e=root.querySelector(`[data-k="${f.k}"]`);if(!e)return;o[f.k]=f.opts||f.t?e.value:parseFloat(String(e.value).replace(",","."))});return o}
const R=(l,v,u="",big=false)=>`<div class="r${big?" big":""}"><div class="l">${l}</div><div class="v">${v}${u?`<small>${u}</small>`:""}</div></div>`;
const note=(t,c="")=>`<div class="note ${c}">${t}</div>`;
const tbl=(head,rows)=>`<div class="tw"><table class="t"><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;

/* ================= DXF va SVG ================= */
/* shape: {cut:[[ [x,y],... ], closed], bend:[[[x,y],[x,y]]], text:[[x,y,h,str]]} */
function dxf(sh){
  const L=[];const p=(...a)=>L.push(...a);
  p("0","SECTION","2","HEADER","9","$INSUNITS","70","4","0","ENDSEC");
  p("0","SECTION","2","TABLES","0","TABLE","2","LAYER","70","3");
  [["KESISH",1],["BUKISH",5],["MATN",7]].forEach(([n,c])=>p("0","LAYER","2",n,"70","0","62",String(c),"6",n==="BUKISH"?"DASHED":"CONTINUOUS"));
  p("0","ENDTAB","0","ENDSEC","0","SECTION","2","ENTITIES");
  const n=v=>(Math.round(v*1000)/1000).toString();
  (sh.cut||[]).forEach(([pts,closed])=>{p("0","POLYLINE","8","KESISH","66","1","70",closed?"1":"0");pts.forEach(q=>p("0","VERTEX","8","KESISH","10",n(q[0]),"20",n(q[1])));p("0","SEQEND","8","KESISH")});
  (sh.line||[]).forEach(([a,b])=>p("0","LINE","8","KESISH","10",n(a[0]),"20",n(a[1]),"11",n(b[0]),"21",n(b[1])));
  (sh.circ||[]).forEach(([x,y,r])=>p("0","CIRCLE","8","KESISH","10",n(x),"20",n(y),"40",n(r)));
  (sh.bend||[]).forEach(([a,b])=>p("0","LINE","8","BUKISH","10",n(a[0]),"20",n(a[1]),"11",n(b[0]),"21",n(b[1])));
  (sh.text||[]).forEach(([x,y,h,s])=>p("0","TEXT","8","MATN","10",n(x),"20",n(y),"40",n(h),"1",s));
  p("0","ENDSEC","0","EOF");return L.join("\n");
}
function bbox(sh){let a=[1e18,1e18,-1e18,-1e18];const add=q=>{a[0]=Math.min(a[0],q[0]);a[1]=Math.min(a[1],q[1]);a[2]=Math.max(a[2],q[0]);a[3]=Math.max(a[3],q[1])};
  (sh.cut||[]).forEach(([pts])=>pts.forEach(add));(sh.bend||[]).forEach(l=>l.forEach(add));(sh.circ||[]).forEach(([x,y,r])=>{add([x-r,y-r]);add([x+r,y+r])});(sh.line||[]).forEach(l=>l.forEach(add));return a}
function svgOf(sh,{dims=true}={}){
  const b=bbox(sh),w=b[2]-b[0],h=b[3]-b[1],m=Math.max(w,h)*0.06+1,vb=[b[0]-m,-(b[3]+m),w+2*m,h+2*m];
  const sw=Math.max(w,h)/320;
  const P=pts=>pts.map(q=>`${q[0].toFixed(2)},${(-q[1]).toFixed(2)}`).join(" ");
  let s=`<svg viewBox="${vb.map(v=>v.toFixed(2)).join(" ")}" xmlns="http://www.w3.org/2000/svg">`;
  (sh.fill||[]).forEach(pts=>s+=`<polygon points="${P(pts)}" fill="#e8b23a22"/>`);
  (sh.cut||[]).forEach(([pts,cl])=>s+=cl?`<polygon points="${P(pts)}" fill="#e8b23a18" stroke="#e8b23a" stroke-width="${sw*1.6}"/>`:`<polyline points="${P(pts)}" fill="none" stroke="#e8b23a" stroke-width="${sw*1.6}"/>`);
  (sh.circ||[]).forEach(([x,y,r])=>s+=`<circle cx="${x}" cy="${-y}" r="${r}" fill="none" stroke="#e8b23a" stroke-width="${sw*1.6}"/>`);
  (sh.line||[]).forEach(([a,c,col])=>s+=`<line x1="${a[0]}" y1="${-a[1]}" x2="${c[0]}" y2="${-c[1]}" stroke="${col||"#e8b23a"}" stroke-width="${sw*2.2}" stroke-linecap="round"/>`);
  (sh.label||[]).forEach(([x,y,t,col])=>s+=`<text x="${x}" y="${-y}" fill="${col||"#eef1f5"}" font-size="${Math.max(w,h)/24}" text-anchor="middle" font-weight="700">${esc(t)}</text>`);
  (sh.dot||[]).forEach(([x,y])=>s+=`<circle cx="${x}" cy="${-y}" r="${sw*4}" fill="#4ea3ff"/>`);
  (sh.bend||[]).forEach(([a,c])=>s+=`<line x1="${a[0]}" y1="${-a[1]}" x2="${c[0]}" y2="${-c[1]}" stroke="#4ea3ff" stroke-width="${sw}" stroke-dasharray="${sw*6} ${sw*4}"/>`);
  if(dims)s+=`<text x="${b[0]+w/2}" y="${-(b[1])+m*0.8}" fill="#9aa4b2" font-size="${Math.max(w,h)/26}" text-anchor="middle">${fmt0(w)} × ${fmt0(h)} mm</text>`;
  return s+"</svg>";
}
/* ================= faylni saqlash / ulashish ================= */
const isNative=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const b64=async blob=>{const buf=new Uint8Array(await blob.arrayBuffer());let s="";for(let i=0;i<buf.length;i+=0x8000)s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));return btoa(s)};
async function saveFile(name,text){
  const blob=new Blob([text],{type:"application/dxf"});
  if(isNative()){try{const P=window.Capacitor.Plugins;const data=await b64(blob);
      await P.Filesystem.writeFile({path:"PayvandUsta/"+name,data,directory:"DOCUMENTS",recursive:true}).catch(()=>{});
      const r=await P.Filesystem.writeFile({path:name,data,directory:"CACHE"});
      toast(name+" — Documents/PayvandUsta papkasiga saqlandi");
      await P.Share.share({title:name,files:[r.uri]}).catch(()=>{});}catch(e){toast("Saqlab bo'lmadi: "+(e.message||e))}return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast(name+" yuklab olindi")}
  catch(e){navigator.clipboard&&navigator.clipboard.writeText(text);toast("DXF matni nusxalandi")}
}
function savePattern(name,sh){const L=store.get("pat",[]);L.unshift({name,at:Date.now(),sh});store.set("pat",L.slice(0,60));toast("“"+name+"” — Mening yoyilmalarimga saqlandi")}
function shapeButtons(name,sh){
  return `<div class="btns"><button class="btn p" data-act="dxf">DXF yuklab olish</button><button class="btn" data-act="save">Saqlab qo'yish</button></div>`;
}
function bindShape(root,name,sh){
  root.querySelectorAll('[data-act="dxf"]').forEach(b=>b.onclick=()=>saveFile(name.replace(/[^\w\-]+/g,"_")+".dxf",dxf(sh)));
  root.querySelectorAll('[data-act="save"]').forEach(b=>b.onclick=()=>savePattern(name,sh));
}

/* ================= yoyish (triangulyatsiya) ================= */
/* P: {nom:[x,y,z]}, tris: [[a,b,c],...] ketma-ket uchburchaklar (oldingi bilan umumiy qirra) */
function unfold(P,tris){
  const d3=(a,b)=>Math.hypot(P[a][0]-P[b][0],P[a][1]-P[b][1],P[a][2]-P[b][2]);
  const pos={},ev=[];
  const place=(p,q,dp,dq,side)=>{const dx=q[0]-p[0],dy=q[1]-p[1],D=Math.hypot(dx,dy);const a=(dp*dp-dq*dq+D*D)/(2*D),h=Math.sqrt(Math.max(0,dp*dp-a*a));const mx=p[0]+a*dx/D,my=p[1]+a*dy/D;return[[mx-h*dy/D,my+h*dx/D],[mx+h*dy/D,my-h*dx/D]]};
  const [a,b,c]=tris[0];pos[a]=[0,0];pos[b]=[d3(a,b),0];pos[c]=place(pos[a],pos[b],d3(a,c),d3(b,c))[0];ev.push([a,pos[a]],[b,pos[b]],[c,pos[c]]);
  let prev=tris[0];
  for(let i=1;i<tris.length;i++){const t=tris[i];const sh=t.filter(x=>prev.includes(x));const nw=t.find(x=>!sh.includes(x));const other=prev.find(x=>!sh.includes(x));
    const p=pos[sh[0]],q=pos[sh[1]],o=pos[other];const cand=place(p,q,d3(nw,sh[0]),d3(nw,sh[1]));
    const sgn=pt=>Math.sign((q[0]-p[0])*(pt[1]-p[1])-(q[1]-p[1])*(pt[0]-p[0]));
    const pick=sgn(cand[0])!==sgn(o)?cand[0]:cand[1];pos[nw]=pick;ev.push([nw,pick]);prev=t}
  return{pos,ev};
}

/* ================= 3D ko'rinish (kutubxonasiz) ================= */
/* mesh: {tris:[[p1,p2,p3,ci],...], cols:["#rrggbb",...]} p=[x,y,z], z — yuqoriga */
const V3={sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm:a=>{const l=Math.hypot(...a)||1;return[a[0]/l,a[1]/l,a[2]/l]}};
function quadMesh(grid,ci,M){/* grid[i][j] nuqtalar to'ri */for(let i=0;i<grid.length-1;i++)for(let j=0;j<grid[i].length-1;j++){const a=grid[i][j],b=grid[i][j+1],c=grid[i+1][j+1],d=grid[i+1][j];M.tris.push([a,b,c,ci],[a,c,d,ci])}}
const view3dHTML=()=>`<h3 class="sec">3D ko'rinish</h3><div class="svgbox" style="position:relative;touch-action:none"><canvas class="v3d" style="width:100%;height:340px;display:block"></canvas><div style="position:absolute;right:12px;bottom:8px;color:#9aa4b2;font-size:12px">barmoq bilan aylantiring</div></div>`;
function view3d(cv,mesh){
  const dpr=Math.min(2,window.devicePixelRatio||1);const W=cv.clientWidth||360,H=cv.clientHeight||340;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);
  let mn=[1e18,1e18,1e18],mx=[-1e18,-1e18,-1e18];mesh.tris.forEach(t=>{for(let k=0;k<3;k++)for(let a=0;a<3;a++){mn[a]=Math.min(mn[a],t[k][a]);mx[a]=Math.max(mx[a],t[k][a])}});
  const c=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2],rad0=Math.hypot(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2])/2||1;
  const T=mesh.tris.map(t=>{const n=V3.norm(V3.cross(V3.sub(t[1],t[0]),V3.sub(t[2],t[0])));return{p:[0,1,2].map(k=>V3.sub(t[k],c)),n,ci:t[3]}});
  const rgb=mesh.cols.map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
  let yaw=-0.7,pitch=0.5,zoom=1;const L=V3.norm([-0.4,-0.6,0.7]);
  function draw(){g.clearRect(0,0,W,H);const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);const s=Math.min(W,H)*0.42/rad0*zoom;
    const R=p=>{const x=p[0]*cy-p[1]*sy,y=p[0]*sy+p[1]*cy,z=p[2];const y2=y*cp-z*sp,z2=y*sp+z*cp;return[x,y2,z2]};
    const list=T.map(t=>{const q=t.p.map(R);const n=R(t.n);return{q,n,ci:t.ci,d:(q[0][1]+q[1][1]+q[2][1])/3}}).sort((a,b)=>b.d-a.d);
    for(const t of list){const lam=0.35+0.65*Math.abs(t.n[0]*L[0]+t.n[1]*L[1]+t.n[2]*L[2]);const k=rgb[t.ci];const col=`rgb(${k.map(v=>Math.min(255,Math.round(v*lam))).join(",")})`;
      g.beginPath();t.q.forEach((p,i)=>{const X=W/2+p[0]*s,Y=H/2-p[2]*s;i?g.lineTo(X,Y):g.moveTo(X,Y)});g.closePath();g.fillStyle=col;g.strokeStyle=col;g.lineWidth=0.6;g.fill();g.stroke()}}
  const pts=new Map();let d0=0;
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){const [a,b]=[...pts.values()];d0=Math.hypot(a[0]-b[0],a[1]-b[1])}};
  cv.onpointermove=e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1){yaw+=(e.clientX-o[0])*0.01;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-o[1])*0.01))}
    else if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d0)zoom=Math.max(0.3,Math.min(5,zoom*d/d0));d0=d}draw()};
  cv.onpointerup=cv.onpointercancel=e=>{pts.delete(e.pointerId);d0=0};
  cv.onwheel=e=>{e.preventDefault();zoom=Math.max(0.3,Math.min(5,zoom*(e.deltaY<0?1.1:0.9)));draw()};
  draw();
}

const MC=["#d9a441","#9aa6b2","#5f9ed8"];
function revMesh(rings,ci,M,n=48){/* rings: [[r,z],...] */const g=rings.map(([r,z])=>{const row=[];for(let j=0;j<=n;j++){const a=2*PI*j/n;row.push([r*Math.cos(a),r*Math.sin(a),z])}return row});quadMesh(g,ci,M)}
function trisMesh(P,tr,ci){return{tris:tr.map(t=>[P[t[0]],P[t[1]],P[t[2]],ci]),cols:MC}}
/* ================= QUVUR ================= */
const ANG=[["45","45°"],["30","30°"],["60","60°"],["22.5","22,5°"],["11.25","11,25°"],["90","90°"]];
const ELB=[["lr","Uzun radius tirsak (1,5D)"],["sr","Qisqa radius tirsak (1D)"],["none","Tirsaksiz (to'g'ridan kesish)"]];
T({id:"offset",cat:"q",ic:"offset",name:"Offset (siljitish)",quick:1,
 desc:"Quvurni to'siqdan aylantirib o'tkazish: qiya qism uzunligi, yurish va kesiladigan quvur uzunligi. Aylanma rejimida bir vaqtda ham tik, ham yonga siljish hisoblanadi.",
 modes:[["s","Oddiy offset"],["r","Aylanma (rolling)"]],
 fields:m=>[
  ...(m==="r"?[{k:"V",l:"Tik siljish",u:"mm",v:300},{k:"H",l:"Yonga siljish",u:"mm",v:400}]:[{k:"H",l:"Siljish (offset)",u:"mm",v:300,w:1}]),
  {k:"a",l:"Tirsak burchagi",v:"45",opts:ANG},{k:"D",l:"Quvur tashqi diametri",u:"mm",v:57},
  {k:"e",l:"Tirsak turi",v:"lr",opts:ELB,w:1},{k:"g",l:"Payvand tirqishi (har chokda)",u:"mm",v:2}],
 calc(v,m){
  const a=rad(+v.a);const off=m==="r"?Math.hypot(v.V,v.H):v.H;
  const travel=off/Math.sin(a),run=off/Math.tan(a);
  const Rb=v.e==="lr"?1.5*v.D:v.e==="sr"?1.0*v.D:0;const to=Rb*Math.tan(a/2);
  const cut=travel-2*to-2*v.g;
  let h=`<div class="res">${R("Kesiladigan quvur uzunligi",fmt(cut),"mm",1)}${R("Qiya uzunlik (markazdan)",fmt(travel),"mm")}${R("Yurish (run)",fmt(run),"mm")}${R("Koeffitsient (1/sin)",fmt(1/Math.sin(a),3))}${R("Tirsak cheki (take-out)",fmt(to),"mm")}`;
  if(m==="r")h+=R("Haqiqiy siljish",fmt(off),"mm")+R("Aylantirish burchagi",fmt(deg(Math.atan2(v.V,v.H)),1),"°");
  h+="</div>";
  if(cut<0)h+=note("Siljish juda kichik: ikki tirsak bir-biriga tegib qoladi. Kichikroq burchak tanlang.","warn");
  h+=note("Qiya uzunlik — tirsak markazlari orasidagi masofa. Kesiladigan uzunlik = qiya uzunlik − 2 × tirsak cheki − payvand tirqishlari."+(m==="r"?" Aylanma offsetda quvurni ko'rsatilgan burchakka buring.":""));
  return h}});

T({id:"branch",cat:"q",ic:"branch",name:"Tarmoq shabloni (vrezka)",quick:1,
 desc:"Bir quvurni ikkinchisiga payvandlash uchun kesish shabloni (egar). Shablonni qog'ozga yoki listga chiqarib, quvurga o'rab chizasiz. Asosiy quvurdagi teshik shabloni ham chiqadi.",
 fields:()=>[{k:"D",l:"Asosiy quvur diametri",u:"mm",v:108},{k:"d",l:"Tarmoq quvur diametri",u:"mm",v:57},
  {k:"a",l:"Ulanish burchagi",u:"°",v:90},{k:"e",l:"Markazdan siljish",u:"mm",v:0},
  {k:"n",l:"Bo'laklar soni",v:"16",opts:[["8","8"],["12","12"],["16","16"],["24","24"],["32","32"]]},{k:"L",l:"Shablon balandligi zaxira",u:"mm",v:40}],
 calc(v){
  const R0=v.D/2,r=v.d/2,a=rad(v.a);
  if(r+Math.abs(v.e)>R0+1e-9)return{html:note("Tarmoq quvur (siljish bilan) asosiy quvurdan katta bo'lishi mumkin emas.","warn")};
  if(v.a<15||v.a>165)return{html:note("Burchak 15° dan 165° gacha bo'lsin.","warn")};
  const t=f=>{const y=r*Math.sin(f)+v.e;return(Math.sqrt(R0*R0-y*y)-r*Math.cos(f)*Math.cos(a))/Math.sin(a)};
  const M=180,pts=[];let mn=1e9,mx=-1e9;for(let i=0;i<=M;i++){const f=2*PI*i/M;const z=t(f);mn=Math.min(mn,z);mx=Math.max(mx,z)}
  for(let i=0;i<=M;i++){const f=2*PI*i/M;pts.push([r*f,t(f)-mn])}
  const H=mx-mn,top=H+v.L,C=2*PI*r;
  const shape={cut:[[[...pts,[C,top],[0,top]],true]],bend:[],text:[]};
  const N=+v.n;const rows=[];for(let k=0;k<N;k++){const f=2*PI*k/N;const x=r*f;rows.push([k+1,fmt0(deg(f)),fmt(x,1),fmt(t(f)-mn,1)]);shape.bend.push([[x,t(f)-mn],[x,top]])}
  // asosiy quvurdagi teshik
  const hole=[];for(let i=0;i<=M;i++){const f=2*PI*i/M;const y=r*Math.sin(f)+v.e;const tt=t(f);const zz=tt*Math.sin(a)+r*Math.cos(f)*Math.cos(a);
    const x=tt*Math.cos(a)-r*Math.cos(f)*Math.sin(a);hole.push([x,R0*Math.asin(Math.max(-1,Math.min(1,y/R0)))])}
  const hs={cut:[[hole,true]]};
  const html=`<div class="res">${R("Shablon uzunligi (aylana)",fmt(C),"mm",1)}${R("Egar chuqurligi",fmt(H),"mm")}${R("Bo'lak oralig'i",fmt(C/N),"mm")}</div>
   <h3 class="sec">Tarmoq quvur shabloni</h3><div class="svgbox">${svgOf(shape)}</div>${shapeButtons()}
   <h3 class="sec">O'lchamlar jadvali</h3>${tbl(["№","Burchak °","Aylana bo'yicha, mm","Balandlik, mm"],rows)}
   <h3 class="sec">Asosiy quvurdagi teshik</h3><div class="svgbox" id="hs">${svgOf(hs)}</div><div class="btns"><button class="btn" id="hdxf">Teshik DXF</button></div>
   ${note("Shablonni 1:1 masshtabda chiqaring (DXF — lazerda yupqa listdan kesish yoki printerda chop etish uchun). Shablon tarmoq quvurning tashqi yuzasiga o'raladi; balandlik 0 bo'lgan nuqta egarning eng chuqur joyi.")}`;
  const Mb={tris:[],cols:MC};const Lh=Math.max(v.D,v.d)*1.4+Math.abs(v.e)+r/Math.tan(Math.max(a,0.3));
  quadMesh([...Array(25)].map((_,i)=>{const x=-Lh+2*Lh*i/24;const row=[];for(let j=0;j<=48;j++){const q=2*PI*j/48;row.push([x,R0*Math.sin(q),R0*Math.cos(q)])}return row}),1,Mb);
  const Lb=Math.max(v.D,v.d)*1.2+mx;const u=[Math.cos(a),0,Math.sin(a)],ww=[-Math.sin(a),0,Math.cos(a)];
  quadMesh([0,1,2,3,4,5,6].map(i=>{const row=[];for(let j=0;j<=48;j++){const f=2*PI*j/48;const tt=t(f)+(Lb-t(f))*i/6;row.push([tt*u[0]+r*Math.cos(f)*ww[0],r*Math.sin(f)+v.e,tt*u[2]+r*Math.cos(f)*ww[2]])}return row}),0,Mb);
  return{html,shape,name:`tarmoq_${v.D}x${v.d}_${v.a}gr`,mesh:Mb,after:root=>{root.querySelector("#hdxf").onclick=()=>saveFile(`teshik_${v.D}x${v.d}.dxf`,dxf(hs))}}}});

T({id:"miter",cat:"q",ic:"elbow",name:"Segmentli tirsak (kesib yasash)",
 desc:"Quvurni bo'laklarga qiya kesib tirsak yasash: har bo'lakning uzunligi va kesish shabloni.",
 fields:()=>[{k:"D",l:"Quvur tashqi diametri",u:"mm",v:159},{k:"A",l:"Tirsak burchagi",u:"°",v:90},
  {k:"n",l:"Bo'laklar soni (uchlari bilan)",v:"4",opts:[["2","2 (bitta kesim)"],["3","3"],["4","4"],["5","5"],["6","6"]]},{k:"Rb",l:"Bukish radiusi (markaz)",u:"mm",v:240},{k:"s",l:"Uchidagi to'g'ri qism",u:"mm",v:50}],
 calc(v){
  const n=+v.n,r=v.D/2,al=rad(v.A)/(2*(n-1));const Rb=n===2?0:v.Rb;
  if(n>2&&Rb<r)return{html:note("Bukish radiusi quvur radiusidan katta bo'lsin.","warn")};
  const mid=2*Rb*Math.tan(al),back=2*(Rb+r)*Math.tan(al),thr=2*(Rb-r)*Math.tan(al);
  const endC=Rb*Math.tan(al)+v.s;
  // o'rta bo'lak shabloni: ikki tomoni qiya
  const M=180,C=2*PI*r,up=[],dn=[];for(let i=0;i<=M;i++){const f=2*PI*i/M;const L=(Rb+r*Math.cos(f))*Math.tan(al);up.push([r*f,L]);dn.push([r*f,-L])}
  const shapeMid={cut:[[[...up,...dn.reverse()],true]]};
  const endP=[];for(let i=0;i<=M;i++){const f=2*PI*i/M;endP.push([r*f,v.s+(Rb+r*Math.cos(f))*Math.tan(al)])}
  const shapeEnd={cut:[[[...endP,[C,0],[0,0]],true]]};
  const N=16,rows=[];for(let k=0;k<N;k++){const f=2*PI*k/N;rows.push([k+1,fmt(r*f,1),fmt((Rb+r*Math.cos(f))*Math.tan(al),1)])}
  const html=`<div class="res">${R("Kesish burchagi",fmt(deg(al),2),"°",1)}${n>2?R("O'rta bo'lak (markaz)",fmt(mid),"mm")+R("O'rta bo'lak tashqi tomoni",fmt(back),"mm")+R("O'rta bo'lak ichki tomoni",fmt(thr),"mm"):""}${R("Uchidagi bo'lak (markaz)",fmt(endC),"mm")}${R("O'rta bo'laklar soni",n-2)}</div>
   ${n>2?`<h3 class="sec">O'rta bo'lak shabloni</h3><div class="svgbox">${svgOf(shapeMid)}</div><div class="btns"><button class="btn p" id="m1">O'rta bo'lak DXF</button></div>`:""}
   <h3 class="sec">Uchidagi bo'lak shabloni</h3><div class="svgbox">${svgOf(shapeEnd)}</div><div class="btns"><button class="btn p" id="m2">Uch bo'lak DXF</button><button class="btn" id="m3">Saqlab qo'yish</button></div>
   <h3 class="sec">Shablon jadvali (o'rta chiziqdan)</h3>${tbl(["№","Aylana bo'yicha, mm","Yarim uzunlik, mm"],rows)}
   ${note("Har bir kesim burchagi = tirsak burchagi ÷ (2 × (bo'laklar − 1)). Shablon jadvalidagi uzunlik — bo'lak o'rtasidan kesish chizig'igacha.")}`;
  const Me={tris:[],cols:MC};const piece=(am,lo,hi,ci)=>{/* o'q: am burchakdagi urinma; lo/hi: parametr chegaralari funksiyasi */
    const T_=[-Math.sin(am),Math.cos(am),0],N_=[Math.cos(am),Math.sin(am),0];const rows=[];for(let i=0;i<=4;i++){const row=[];for(let j=0;j<=40;j++){const f=2*PI*j/40;const rho=r*Math.cos(f),z=r*Math.sin(f);const pr=lo(rho)+(hi(rho)-lo(rho))*i/4;
      row.push([(Rb+rho)*N_[0]+pr*T_[0],(Rb+rho)*N_[1]+pr*T_[1],z])}rows.push(row)}quadMesh(rows,ci,Me)};
  const A_=rad(v.A);piece(0,()=>-v.s,rho=>(Rb+rho)*Math.tan(al),0);for(let k=1;k<n-1;k++)piece(2*k*al,rho=>-(Rb+rho)*Math.tan(al),rho=>(Rb+rho)*Math.tan(al),k%2?1:0);piece(A_,rho=>-(Rb+rho)*Math.tan(al),()=>v.s,(n-1)%2?1:0);
  return{html,mesh:Me,after:root=>{const a=root.querySelector("#m1");if(a)a.onclick=()=>saveFile(`tirsak_orta_${v.D}.dxf`,dxf(shapeMid));root.querySelector("#m2").onclick=()=>saveFile(`tirsak_uch_${v.D}.dxf`,dxf(shapeEnd));root.querySelector("#m3").onclick=()=>savePattern(`Tirsak ${v.D} mm, ${v.A}°`,n>2?shapeMid:shapeEnd)}}}});

T({id:"flow",cat:"q",ic:"flow",name:"Oqim va diametr",quick:1,
 desc:"Quvurdan o'tadigan suv/suyuqlik miqdori, yoki kerakli oqim uchun quvur diametri.",
 modes:[["q","Oqimni topish"],["d","Diametrni topish"]],
 fields:m=>m==="q"?[{k:"d",l:"Quvur ichki diametri",u:"mm",v:50},{k:"s",l:"Oqim tezligi",u:"m/s",v:1.5}]
  :[{k:"Q",l:"Kerakli oqim",u:"m³/soat",v:10},{k:"s",l:"Tezlik (suv uchun 1–2)",u:"m/s",v:1.5}],
 calc(v,m){
  if(m==="q"){const A=PI*(v.d/1000)**2/4,Q=A*v.s;return`<div class="res">${R("Oqim",fmt(Q*3600,2),"m³/soat",1)}${R("Litr/daqiqa",fmt(Q*60000,1),"l/min")}${R("Litr/soniya",fmt(Q*1000,2),"l/s")}${R("Kesim yuzasi",fmt(A*1e6,0),"mm²")}</div>`}
  const d=Math.sqrt(4*(v.Q/3600)/(PI*v.s))*1000;const near=PIPES.find(p=>p[2]-2*p[3]>=d)||PIPES[PIPES.length-1];

T({id:"pipew",cat:"q",ic:"cyl",name:"Quvur hajmi va og'irligi",

function compat(a,b){
  const k=[a,b].sort().join("-");const S=(s,mma,mig,tig,n)=>({s,mma,mig,tig,n});
  const steel=["cs","la"];

  if(a==="al"||b==="al")return S("no","—","—","—","Alyuminiyni boshqa metallga oddiy payvand bilan ulab bo'lmaydi: mo'rt birikma hosil bo'ladi. Bimetall o'tish plastinasi, bolt, parchin yoki yopishtirish ishlating.");
  if(steel.includes(a)&&steel.includes(b))return S("ok","E6013 (MR-3, ANO-21) — oddiy ishlar; E7018 (UONI-13/55) — mas'uliyatli choklar","ER70S-6 (Sv-08G2S), gaz: CO₂ yoki 82% Ar + 18% CO₂","ER70S-6, doimiy tok (DC−), 100% argon",(a==="la"||b==="la")?"09G2S qalinligi 20 mm dan oshsa, 100–150°C gacha oldindan qizdiring.":"Eng oson payvandlanadigan juftlik.");
  if(k==="ss-ss")return S("ok","E308L-16 (OZL-8)","ER308LSi, gaz: 98% Ar + 2% CO₂","ER308L, DC−, 100% argon + quvur ichini argon bilan puflash","Issiqlikni kam bering, qatlamlar orasida 150°C dan sovuting. Uglerodli po'lat cho'tkasini ishlatmang.");
  if(k==="s6-s6"||k==="s6-ss")return S("ok","E316L-16 (OZL-20)","ER316LSi, 98% Ar + 2% CO₂","ER316L, DC−, argon + ichini puflash","316 bilan 304 ni ulashda 316L sim ishlating.");
  if((a==="ss"||a==="s6"||b==="ss"||b==="s6")&&(steel.includes(a)||steel.includes(b)))return S("w","E309L-16 (OZL-6, TsL-25)","ER309LSi, 98% Ar + 2% CO₂","ER309L, DC−, argon","Turli metallar: faqat 309L tipidagi sim/elektrod ishlating — oddiy elektrod chok yorilishiga olib keladi. Issiqlikni kamroq bering.");
  if(a==="gz"||b==="gz"){if(a==="ci"||b==="ci"||a==="cu"||b==="cu")return S("w","—","CuSi3 bilan MIG-kavsharlash","ERCuSi-A","Avval rux qatlamini tozalab tashlang.");
    if(a==="ss"||a==="s6"||b==="ss"||b==="s6")return S("w","E309L-16","ER309LSi","ER309L","Payvand joyidan rux qatlamini 20–30 mm kenglikda silliqlab olib tashlang.");
    return S("w","E6013 (rux tozalangandan keyin)","CuSi3 sim bilan MIG-kavsharlash (rux kuymaydi) yoki ER70S-6","ERCuSi-A","Rux tutuni zaharli! Yaxshi shamollatish va respirator shart. Chokdan keyin rux bo'yoq (sovuq ruxlash) surting.")}
  if(k==="ci-ci")return S("w","ENi-CI (OZCh-2, MNCh-2 — nikelli)","Odatda ishlatilmaydi","ERNi-CI","Cho'yan yoriladi: 200–300°C gacha qizdiring yoki «sovuq usul» — 20–30 mm qisqa choklar, har biridan keyin bolg'acha bilan urib, sovuting. Sekin soviting.");
  if(a==="ci"||b==="ci"){if(a==="cu"||b==="cu")return S("w","—","—","Bronza bilan kavsharlash","Bronza (latun) kavsharlash eng ishonchli.");
    return S("w","ENiFe-CI (temir-nikelli)","—","ERNiFe-CI","Cho'yan tomonni 200–300°C gacha qizdiring, qisqa choklar bilan payvandlang.")}
  if(k==="cu-cu")return S("w","Komsomolets-100 (misli elektrod)","ERCu, 100% argon yoki Ar+He","ERCu, DC−, argon","Mis issiqlikni tez tarqatadi: 3 mm dan qalinida 300–500°C gacha qizdiring.");
  if(a==="cu"||b==="cu")return S("w","—","CuSi3 sim bilan MIG-kavsharlash","ERCuSi-A (kremniyli bronza)","Mis + po'latni bronza sim bilan kavsharlash eng oson va mustahkam.");
  return S("w","—","—","—","Mutaxassis bilan maslahatlashing.");
}

 calc(v){const CE=v.C+v.Mn/6+(v.Cr+v.Mo+v.V)/5+(v.Ni+v.Cu)/15;let T0=CE<0.35?0:CE<0.45?(v.t>25?75:v.t>15?50:0):CE<0.55?(v.t>25?150:100):CE<0.7?200:250;

/* ================= YOYILMA (list metall) ================= */
const DIMT=[["o","Tashqi o'lchamlar"],["i","Ichki o'lchamlar"],["m","O'rta chiziq bo'yicha"]];
const neu=(x,t,m)=>m==="o"?x-t:m==="i"?x+t:x;
const arcPts=(R,a0,a1,n)=>{const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([R*Math.cos(a),R*Math.sin(a)])}return p};

T({id:"cone",cat:"y",ic:"cone",name:"Konus yoyilmasi",quick:1,
 desc:"To'liq yoki kesik konus (voronka, truba o'tish) uchun list yoyilmasi. DXF chiqarib lazerda kesish mumkin.",
 fields:()=>[{k:"D",l:"Katta diametr",u:"mm",v:600},{k:"d",l:"Kichik diametr (0 — o'tkir uch)",u:"mm",v:200},{k:"H",l:"Balandlik",u:"mm",v:400},{k:"t",l:"List qalinligi",u:"mm",v:2},
  {k:"m",l:"O'lchamlar",v:"o",opts:DIMT},{k:"n",l:"Nechta bo'lakdan",v:"1",opts:[["1","1 bo'lak"],["2","2 bo'lak"],["3","3 bo'lak"],["4","4 bo'lak"]]}],
 calc(v){const D=neu(v.D,v.t,v.m),d=v.d>0?neu(v.d,v.t,v.m):0,n=+v.n;
  if(d>=D)return{html:note("Kichik diametr kattasidan kichik bo'lsin (silindr uchun «Silindr yoyilmasi»dan foydalaning).","warn")};
  const L=Math.hypot(v.H,(D-d)/2),R1=L*D/(D-d),R2=R1*d/D,th=2*PI*(D/2)/R1/n;
  const seg=Math.max(24,Math.round(deg(th)));const a0=PI/2-th/2,a1=PI/2+th/2;
  const outer=arcPts(R1,a0,a1,seg),inner=R2>0?arcPts(R2,a1,a0,seg):[[0,0]];
  const bend=[];const nb=12;for(let i=1;i<nb;i++){const a=a0+(a1-a0)*i/nb;bend.push([[R2*Math.cos(a),R2*Math.sin(a)],[R1*Math.cos(a),R1*Math.sin(a)]])}
  const sh={cut:[[[...outer,...inner],true]],bend};const b=bbox(sh);
  const html=`<div class="res">${R("Yoyilma burchagi (har bo'lak)",fmt(deg(th),2),"°",1)}${R("Katta radius R",fmt(R1),"mm")}${R("Kichik radius r",fmt(R2),"mm")}${R("Yasovchi uzunligi",fmt(L),"mm")}${R("Vatar (katta yoy)",fmt(2*R1*Math.sin(th/2)),"mm")}${R("List o'lchami",`${fmt0(b[2]-b[0])}×${fmt0(b[3]-b[1])}`,"mm")}</div>
   <div class="svgbox">${svgOf(sh)}</div>${shapeButtons()}
   ${note("Ko'k chiziqlar — press yoki valikda bukish uchun belgilar. Tutashuv chokini hisobga olmagan holda chizilgan; kerak bo'lsa bir tomoniga zaxira qo'shing.")}`;
  const M={tris:[],cols:MC};revMesh([[v.D/2,0],[Math.max(v.d,0.01)/2,v.H]],0,M);
  return{html,shape:sh,name:`konus_${v.D}_${v.d}_${v.H}`,mesh:M}}});

T({id:"cyl",cat:"y",ic:"cyl",name:"Silindr / quvur yoyilmasi",
 desc:"Listdan quvur, bak yoki silindr yasash uchun list o'lchami.",
 fields:()=>[{k:"D",l:"Diametr",u:"mm",v:300},{k:"H",l:"Balandlik",u:"mm",v:500},{k:"t",l:"Qalinlik",u:"mm",v:2},{k:"m",l:"O'lchamlar",v:"o",opts:DIMT}],
 calc(v){const D=neu(v.D,v.t,v.m),C=PI*D;const sh={cut:[[[[0,0],[C,0],[C,v.H],[0,v.H]],true]],bend:[1,2,3,4,5,6,7].map(i=>[[C*i/8,0],[C*i/8,v.H]])};
  return{html:`<div class="res">${R("List uzunligi",fmt(C),"mm",1)}${R("List eni",fmt(v.H),"mm")}${R("O'rta diametr",fmt(D),"mm")}${R("Og'irligi (po'lat)",fmt(C*v.H*v.t*7.85e-6,2),"kg")}</div><div class="svgbox">${svgOf(sh)}</div>${shapeButtons()}`,shape:sh,name:`silindr_${v.D}x${v.H}`,mesh:(()=>{const M={tris:[],cols:MC};revMesh([[v.D/2,0],[v.D/2,v.H]],0,M);return M})()}}});

T({id:"sq2r",cat:"y",ic:"sq2r",name:"Kvadratdan doiraga o'tish",quick:1,
 desc:"To'rtburchak teshikdan dumaloq trubaga o'tish (perexod) yoyilmasi — ventilyatsiya, bunker, mo'ri uchun. Bitta list, chok tomon o'rtasida.",
 fields:()=>[{k:"A",l:"To'rtburchak eni A",u:"mm",v:400},{k:"B",l:"To'rtburchak bo'yi B",u:"mm",v:300},{k:"d",l:"Doira diametri",u:"mm",v:200},{k:"H",l:"Balandlik",u:"mm",v:250},
  {k:"ex",l:"Doira siljishi X",u:"mm",v:0},{k:"ey",l:"Doira siljishi Y",u:"mm",v:0},{k:"t",l:"Qalinlik",u:"mm",v:1},{k:"m",l:"O'lchamlar",v:"o",opts:DIMT},{k:"q",l:"Aniqlik (chorakda bo'lak)",v:"6",opts:[["3","3"],["4","4"],["6","6"],["8","8"]]}],
 calc(v){const A=neu(v.A,v.t,v.m),B=neu(v.B,v.t,v.m),r=neu(v.d,v.t,v.m)/2,m=+v.q,N=4*m;
  if(r*2>=Math.min(A,B)+1e-9&&v.H<=0)return{html:note("O'lchamlarni tekshiring.","warn")};
  const P={M:[0,-B/2,0],M2:[0,-B/2,0],C1:[A/2,-B/2,0],C2:[A/2,B/2,0],C3:[-A/2,B/2,0],C4:[-A/2,-B/2,0]};
  for(let k=0;k<=N;k++){const f=rad(270)+2*PI*k/N;P["T"+k]=[v.ex+r*Math.cos(f),v.ey+r*Math.sin(f),v.H]}
  const tr=[["M","T0","C1"]];const C=["C1","C2","C3","C4"];
  for(let q=0;q<4;q++){for(let k=q*m;k<(q+1)*m;k++)tr.push([C[q],"T"+k,"T"+(k+1)]);tr.push(q<3?[C[q],"T"+((q+1)*m),C[q+1]]:[C[3],"T"+N,"M2"])}
  const {pos}=unfold(P,tr);
  const bot=["M","C1","C2","C3","C4","M2"].map(x=>pos[x]),top=[];for(let k=0;k<=N;k++)top.push(pos["T"+k]);
  const bend=[];for(let q=0;q<4;q++)for(let k=q*m;k<=(q+1)*m;k++)bend.push([pos[C[q]],pos["T"+k]]);
  const sh={cut:[[[...bot,...top.reverse()],true]],bend};const b=bbox(sh);
  const html=`<div class="res">${R("List o'lchami (taxm.)",`${fmt0(b[2]-b[0])} × ${fmt0(b[3]-b[1])}`,"mm",1)}${R("Chok uzunligi",fmt(Math.hypot(P.T0[0],P.T0[1]+B/2,v.H)),"mm")}${R("Og'irlik (po'lat, taxm.)",fmt(area(sh.cut[0][0])*v.t*7.85e-6,2),"kg")}</div>
   <div class="svgbox">${svgOf(sh)}</div>${shapeButtons()}
   ${note("Ko'k chiziqlar — burchaklardan doiraga boruvchi bukish chiziqlari. Burchaklar keskin, doira tomonida silliq bukiladi. Chok to'rtburchakning A tomoni o'rtasida.")}`;
  return{html,shape:sh,name:`perexod_${v.A}x${v.B}_d${v.d}`,mesh:trisMesh(P,tr,0)}}});
function area(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1]}return Math.abs(s/2)}

T({id:"hopper",cat:"y",ic:"hopper",name:"Bunker / voronka (to'rtburchak)",
 desc:"Yuqorisi katta, pasti kichik to'rtburchak voronka (bunker, zont, kolpak) yoyilmasi. Pastki teshikni siljitish mumkin.",
 fields:()=>[{k:"A",l:"Yuqori eni A",u:"mm",v:800},{k:"B",l:"Yuqori bo'yi B",u:"mm",v:600},{k:"a",l:"Pastki eni a",u:"mm",v:200},{k:"b",l:"Pastki bo'yi b",u:"mm",v:200},
  {k:"H",l:"Balandlik",u:"mm",v:500},{k:"ex",l:"Pastki siljish X",u:"mm",v:0},{k:"ey",l:"Pastki siljish Y",u:"mm",v:0},{k:"t",l:"Qalinlik",u:"mm",v:2},{k:"m",l:"O'lchamlar",v:"o",opts:DIMT}],
 calc(v){const A=neu(v.A,v.t,v.m),B=neu(v.B,v.t,v.m),a=neu(v.a,v.t,v.m),b=neu(v.b,v.t,v.m);
  const sg=[[-1,-1],[1,-1],[1,1],[-1,1]];const P={};
  sg.forEach((s,i)=>{P["b"+(i+1)]=[v.ex+s[0]*a/2,v.ey+s[1]*b/2,0];P["t"+(i+1)]=[s[0]*A/2,s[1]*B/2,v.H]});P.B1=P.b1;P.T1=P.t1;
  const tr=[["b1","t1","b2"],["t1","b2","t2"],["b2","t2","b3"],["t2","b3","t3"],["b3","t3","b4"],["t3","b4","t4"],["b4","t4","B1"],["t4","B1","T1"]];
  const {pos}=unfold(P,tr);
  const sh={cut:[[[...["b1","b2","b3","b4","B1"].map(x=>pos[x]),...["T1","t4","t3","t2","t1"].map(x=>pos[x])],true]],bend:[["b2","t2"],["b3","t3"],["b4","t4"]].map(([x,y])=>[pos[x],pos[y]])};
  const bb=bbox(sh);const slope=deg(Math.atan2(v.H,(A-a)/2));
  return{html:`<div class="res">${R("List o'lchami (taxm.)",`${fmt0(bb[2]-bb[0])} × ${fmt0(bb[3]-bb[1])}`,"mm",1)}${R("Devor qiyaligi (A tomon)",fmt(slope,1),"°")}${R("Og'irlik (po'lat, taxm.)",fmt(area(sh.cut[0][0])*v.t*7.85e-6,2),"kg")}</div>
   <div class="svgbox">${svgOf(sh)}</div>${shapeButtons()}${note("Bitta listdan, chok bir burchakda. Katta bunkerlarni 2 yoki 4 bo'lakdan yasash uchun yoyilmani bukish chiziqlari bo'yicha bo'ling.")}`,shape:sh,name:`bunker_${v.A}x${v.B}_${v.a}x${v.b}`,mesh:trisMesh(P,tr,0)}}});

const kDIN=(r,t)=>Math.min(0.5,Math.max(0.25,(0.65+0.5*Math.log10(Math.max(r/t,0.1)))/2));
T({id:"bend",cat:"y",ic:"bend",name:"List bukish (razvertka)",quick:1,
 desc:"Bukiladigan detalning yoyilgan (kesish) uzunligi va bukish chiziqlari joyi. Tashqi o'lchamlar bo'yicha.",
 fields:()=>[{k:"f",l:"Tomonlar (tashqi o'lchamlar, vergul bilan)",v:"50, 100, 50",t:"text",w:1},{k:"a",l:"Bukish burchagi",u:"°",v:90},{k:"t",l:"Qalinlik",u:"mm",v:2},{k:"r",l:"Ichki radius",u:"mm",v:2},{k:"K",l:"K-faktor (0 — avtomatik)",v:0},{k:"W",l:"Detal eni (DXF uchun)",u:"mm",v:200}],
 calc(v){const F=String(v.f).split(/[,;\s]+/).map(x=>parseFloat(x.replace(",","."))).filter(x=>x>0);if(F.length<2)return{html:note("Kamida 2 ta tomon yozing, masalan: 50, 100, 50","warn")};
  const K=v.K>0?v.K:kDIN(v.r,v.t),a=rad(v.a),BA=a*(v.r+K*v.t),OS=Math.tan(a/2)*(v.r+v.t),BD=2*OS-BA,n=F.length-1,flat=F.reduce((s,x)=>s+x,0)-n*BD;
  const lines=[];let x=0;for(let i=0;i<n;i++){x+=F[i]-(i===0?OS:2*OS)+(i===0?0:BA);lines.push(x+BA/2)}
  // aniq: har bir tekis qism uzunligi
  const flats=F.map((L,i)=>L-(i>0?OS:0)-(i<n?OS:0));let cx=0;const marks=[];for(let i=0;i<n;i++){cx+=flats[i];marks.push(cx+BA/2);cx+=BA}
  const sh={cut:[[[[0,0],[flat,0],[flat,v.W],[0,v.W]],true]],bend:marks.map(m=>[[m,0],[m,v.W]])};
  const V=v.t<=3?8*v.t:10*v.t;
  return{html:`<div class="res">${R("Yoyilgan uzunlik (kesish)",fmt(flat,2),"mm",1)}${R("Bukish chegirmasi (BA)",fmt(BA,2),"mm")}${R("Bukish ayirmasi (BD)",fmt(BD,2),"mm")}${R("K-faktor",fmt(K,3))}${R("Matritsa (V) tavsiya",fmt0(V),"mm")}${R("Bukishlar soni",n)}</div>
   <h3 class="sec">Bukish chiziqlari (chapdan)</h3>${tbl(["№","Chiziq markazi, mm","Tekis qism, mm"],marks.map((m,i)=>[i+1,fmt(m,2),fmt(flats[i],2)]))}
   <div class="svgbox">${svgOf(sh)}</div>${shapeButtons()}
   ${note("K-faktor avtomatik DIN 6935 bo'yicha hisoblanadi. Aniq natija uchun bir marta sinov detali bukib, o'lchab, K-faktorni moslang. Matritsa V ≈ 8×qalinlik (3 mm gacha), ichki radius taxminan V/6 bo'ladi.")}`,shape:sh,name:`bukish_${F.join("-")}_t${v.t}`}}});

T({id:"bump",cat:"y",ic:"bump",name:"Bosqichli bukish (bump)",
 desc:"Katta radiusni pressda ko'p marta oz-ozdan bukib olish: har bukish orasidagi masofa va burchak.",
 fields:()=>[{k:"R",l:"Ichki radius",u:"mm",v:300},{k:"a",l:"Umumiy burchak",u:"°",v:90},{k:"t",l:"Qalinlik",u:"mm",v:3},{k:"n",l:"Bukishlar soni",v:15},{k:"K",l:"K-faktor",v:0.45}],
 calc(v){const n=Math.max(2,Math.round(v.n));const arc=rad(v.a)*(v.R+v.K*v.t),step=arc/n,each=v.a/n;
  const rows=[];for(let i=0;i<n;i++)rows.push([i+1,fmt(step/2+i*step,1)]);
  return`<div class="res">${R("Bukishlar oralig'i",fmt(step,2),"mm",1)}${R("Har bukish burchagi",fmt(each,2),"°")}${R("Yoy uzunligi (yoyilma)",fmt(arc,1),"mm")}${R("Tashqi yoy",fmt(rad(v.a)*(v.R+v.t),1),"mm")}</div>
  ${tbl(["№","Yoy boshidan, mm"],rows)}`+note("Bukishlarni bir xil oraliqda belgilab, har birini bir xil burchakka bosing. Bukishlar ko'p bo'lsa, sirt silliqroq chiqadi.")}});

T({id:"mitre",cat:"y",ic:"mitre",name:"Burchak kesish (profil)",quick:1,
 desc:"Profil truba, ugolok yoki reykani burchak ostida ulash uchun kesish burchagi va uzunlik farqi.",
 modes:[["a","Burchak bo'yicha"],["n","Ko'pburchak ramka"]],
 fields:m=>[m==="n"?{k:"N",l:"Tomonlar soni",v:6}:{k:"A",l:"Detallar orasidagi burchak",u:"°",v:90},{k:"w",l:"Profil eni (ko'rinadigan tomon)",u:"mm",v:40},{k:"L",l:"Tashqi uzunlik",u:"mm",v:1000}],
 calc(v,m){const beta=m==="n"?180-360/Math.max(3,v.N):v.A;const cut=(180-beta)/2;const dL=2*v.w*Math.tan(rad(cut));
  return`<div class="res">${R("Kesish burchagi (arra)",fmt(cut,2),"°",1)}${R("Tutashish burchagi",fmt(beta,1),"°")}${R("Ichki uzunlik",fmt(v.L-dL,1),"mm")}${R("Tashqi-ichki farqi",fmt(dL,1),"mm")}${R("Kesik chizig'i uzunligi",fmt(v.w/Math.cos(rad(cut)),1),"mm")}</div>`
  +note("Arra burchagi to'g'ri (90°) kesishdan hisoblanadi: to'g'ri burchakli ramka uchun 45°. Ikkala detal ham bir xil burchakda kesiladi.")}});

function packBars(parts,stock,kerf){const bars=[];[...parts].sort((a,b)=>b-a).forEach(p=>{const b=bars.find(b=>b.left>=p+kerf);if(b){b.left-=p+kerf;b.p.push(p)}else bars.push({left:stock-p-kerf,p:[p]})});return bars}
T({id:"frame",cat:"y",ic:"frame",name:"Ramka (kesish ro'yxati)",
 desc:"Profil trubadan ramka: detallar uzunligi, nechta 6 metrlik truba kerak, og'irligi.",
 fields:()=>[{k:"W",l:"Ramka eni (tashqi)",u:"mm",v:2000},{k:"H",l:"Ramka bo'yi (tashqi)",u:"mm",v:1000},{k:"pa",l:"Profil eni",u:"mm",v:40},{k:"pb",l:"Profil bo'yi",u:"mm",v:20},{k:"pt",l:"Profil qalinligi",u:"mm",v:2},
  {k:"j",l:"Ulanish",v:"45",opts:[["45","45° burchak kesish"],["s","To'g'ri (yonlari ichida)"]]},{k:"x",l:"O'rtadagi ustunlar soni",v:1},{k:"q",l:"Ramkalar soni",v:1},{k:"S",l:"Truba uzunligi",u:"mm",v:6000},{k:"pr",l:"1 metr narxi",u:"so'm",v:25000}],
 calc(v){const w=v.pa,q=Math.max(1,Math.round(v.q)),x=Math.max(0,Math.round(v.x));let parts=[];
  if(v.j==="45")parts.push(["Yuqori/past (45°)",v.W,2],["Yon (45°)",v.H,2]);else parts.push(["Yuqori/past",v.W,2],["Yon (ichida)",v.H-2*w,2]);
  if(x)parts.push(["O'rta ustun",v.H-2*w,x]);
  const all=[];parts.forEach(p=>{for(let i=0;i<p[2]*q;i++)all.push(p[1])});const bars=packBars(all,v.S,3);const tot=all.reduce((s,a)=>s+a,0)/1000;
  const kgm=(2*(v.pa+v.pb)-4*v.pt)*v.pt*0.00785;
  const sh={cut:[[[[0,0],[v.W,0],[v.W,v.H],[0,v.H]],true],[[[w,w],[v.W-w,w],[v.W-w,v.H-w],[w,v.H-w]],true]],bend:[]};
  for(let i=1;i<=x;i++){const cx=v.W*i/(x+1);sh.cut.push([[[cx-w/2,w],[cx+w/2,w],[cx+w/2,v.H-w],[cx-w/2,v.H-w]],true])}
  return`<div class="res">${R("Kerakli trubalar",bars.length,`dona × ${fmt0(v.S/1000)} m`,1)}${R("Jami profil",fmt(tot,2),"m")}${R("Og'irlik",fmt(tot*kgm,1),"kg")}${R("Narx (trubalar)",fmt0(bars.length*v.S/1000*v.pr),"so'm")}</div>
  <h3 class="sec">Kesish ro'yxati</h3>${tbl(["Detal","Uzunlik, mm","Soni"],parts.map(p=>[p[0],fmt(p[1],0),p[2]*q]))}
  <h3 class="sec">Trubalarga joylash</h3>${tbl(["Truba","Detallar","Qoldiq, mm"],bars.map((b,i)=>[i+1,b.p.map(fmt0).join(" + "),fmt0(b.left)]))}
  <div class="svgbox">${svgOf(sh)}</div>`+note("Har kesimga 3 mm arra izi hisobga olingan.")}});

T({id:"laser",cat:"y",ic:"laser",name:"Lazer kesish narxi",

T({id:"mypat",cat:"y",ic:"folder",name:"Mening yoyilmalarim",custom:1,

const SHAPES=[["list","List"],["truba","Dumaloq truba"],["profil","Profil truba"],["prut","Prut (dumaloq)"],["kv","Kvadrat"],["ugol","Ugolok"],["polosa","Polosa"],["shv","Shveller (taxm.)"]];
T({id:"weight",cat:"m",ic:"weight",name:"Metall og'irligi va narxi",quick:1,
 desc:"List, truba, profil, prut, ugolok og'irligi va narxi.",
 modes:SHAPES.map(s=>[s[0],s[1]]),
 fields:m=>{const L={k:"L",l:m==="list"?"Uzunlik":"Uzunlik",u:"mm",v:m==="list"?2500:6000};const q={k:"q",l:"Soni",v:1};const mat={k:"mat",l:"Material",v:"7.85",opts:MATS};const pr={k:"pr",l:"1 kg narxi",u:"so'm",v:12000};
  const F={list:[{k:"a",l:"Eni",u:"mm",v:1250},L,{k:"t",l:"Qalinlik",u:"mm",v:2}],truba:[{k:"D",l:"Tashqi diametr",u:"mm",v:57},{k:"t",l:"Devor",u:"mm",v:3},L],
   profil:[{k:"a",l:"Eni",u:"mm",v:40},{k:"b",l:"Bo'yi",u:"mm",v:20},{k:"t",l:"Devor",u:"mm",v:2},L],prut:[{k:"D",l:"Diametr",u:"mm",v:12},L],kv:[{k:"a",l:"Tomoni",u:"mm",v:12},L],
   ugol:[{k:"a",l:"1-tomon",u:"mm",v:50},{k:"b",l:"2-tomon",u:"mm",v:50},{k:"t",l:"Qalinlik",u:"mm",v:5},L],polosa:[{k:"a",l:"Eni",u:"mm",v:40},{k:"t",l:"Qalinlik",u:"mm",v:4},L],
   shv:[{k:"h",l:"Balandlik h",u:"mm",v:100},{k:"b",l:"Tokcha b",u:"mm",v:46},{k:"s",l:"Devor s",u:"mm",v:4.5},{k:"t",l:"Tokcha qalinligi t",u:"mm",v:7.6},L]}[m]||[];
  return[...F,q,mat,pr]},
 calc(v,m){const A={list:()=>v.a*v.t,truba:()=>PI*(v.D-v.t)*v.t,profil:()=>(2*(v.a+v.b)-4*v.t)*v.t,prut:()=>PI*v.D*v.D/4,kv:()=>v.a*v.a,ugol:()=>(v.a+v.b-v.t)*v.t,polosa:()=>v.a*v.t,shv:()=>v.h*v.s+2*(v.b-v.s)*v.t}[m]();

  return`<div class="res">${R("Umumiy og'irlik",fmt(tot,2),"kg",1)}${R(m==="list"?"1 m² og'irligi":"1 metr og'irligi",fmt(m==="list"?v.t*(+v.mat):kgm,2),m==="list"?"kg/m²":"kg/m")}${R("Bitta dona",fmt(one,2),"kg")}${R("Narxi",fmt0(tot*v.pr),"so'm")}${m==="list"?R("Maydon",fmt(v.a*v.L/1e6*v.q,2),"m²"):R("Jami uzunlik",fmt(v.L/1000*v.q,2),"m")}</div>`}});

 calc(v){const b=v.x*PU.find(p=>p[0]===v.u)[2];return`<div class="res">${PU.map((p,i)=>R(p[1],fmt(b/p[2],p[0]==="mpa"?4:2),"",p[0]===v.u)).join("")}</div>`}});

T({id:"inch",cat:"m",ic:"conv",name:"Dyuym ↔ mm",
 desc:"Dyuym (kasr ham bo'ladi: 1 1/2) va millimetr.",
 fields:()=>[{k:"x",l:"Dyuym (masalan 3/4 yoki 1 1/2)",v:"3/4",t:"text",w:1},{k:"mm",l:"yoki millimetr",u:"mm",v:0}],
 calc(v){const p=String(v.x).trim().split(/\s+/);let inch=0;p.forEach(s=>{if(s.includes("/")){const [a,b]=s.split("/");inch+=(+a)/(+b)}else inch+=parseFloat(s.replace(",","."))||0});
  const mm=inch*25.4;const back=v.mm>0?v.mm/25.4:0;
  return`<div class="res">${R(`${esc(v.x)}″ =`,fmt(mm,2),"mm",1)}${v.mm>0?R(`${fmt(v.mm,1)} mm =`,fmt(back,3),"dyuym"):""}${R("1/8 ga yaxlit",fmt(Math.round((v.mm>0?back:inch)*8)/8,3),"″")}</div>`+note("Quvurlarda dyuym — shartli o'lcham: masalan ¾″ quvurning tashqi diametri 26,9 mm (jadvalga qarang).")}});

T({id:"gas",cat:"m",ic:"cyl",name:"Gaz ballon zaxirasi",
 desc:"Argon yoki karbonat ballon qancha vaqtga yetadi.",
 fields:()=>[{k:"V",l:"Ballon hajmi",u:"litr",v:40},{k:"P",l:"Ballondagi bosim",u:"bar",v:150},{k:"q",l:"Gaz sarfi",u:"l/min",v:12},{k:"g",l:"Gaz",v:"ar",opts:[["ar","Argon / aralashma"],["co2","Karbonat (CO₂, suyuq)"]]}],
 calc(v){const gas=v.g==="co2"?v.V*0.6*509:v.V*v.P;const min=gas/v.q;
  return`<div class="res">${R("Yetadi (sof yonish vaqti)",fmt(min/60,1),"soat",1)}${R("Gaz miqdori",fmt0(gas),"litr")}</div>`+note(v.g==="co2"?"40 litrli CO₂ ballonida ~24 kg suyuq karbonat, bu ~12 000 litr gaz. Bosim o'lchagich CO₂ da qolgan miqdorni ko'rsatmaydi — og'irlik bo'yicha tekshiring.":"Argon miqdori = ballon hajmi × bosim. 40 l × 150 bar ≈ 6 m³.")}});
/* ================= QUVUR — qo'shimchalar ================= */
/* ASME B16.9 fitinglar: NPS, DN, OD, 90°LR A, 45°LR B, 90°SR A, Tройник C, Reduktor H, Zaglushka E (mm) */
const FIT=[["1/2",15,21.3,38,16,"—",25,"—",25],["3/4",20,26.7,38,19,"—",29,38,25],["1",25,33.4,38,22,25,38,51,38],["1¼",32,42.2,48,25,32,48,51,38],["1½",40,48.3,57,29,38,57,64,38],
 ["2",50,60.3,76,35,51,64,76,38],["2½",65,73.0,95,44,64,76,89,38],["3",80,88.9,114,51,76,86,89,51],["4",100,114.3,152,64,102,105,102,64],["5",125,141.3,190,79,127,124,127,76],
 ["6",150,168.3,229,95,152,143,140,89],["8",200,219.1,305,127,203,178,152,102],["10",250,273.0,381,159,254,216,178,127],["12",300,323.8,457,190,305,254,203,152],
 ["14",350,355.6,533,222,356,279,330,165],["16",400,406.4,610,254,406,305,356,178],["18",450,457,686,286,457,343,381,203],["20",500,508,762,318,508,381,508,229],["24",600,610,914,381,610,432,508,267]];
const DNOPT=FIT.map(f=>[String(f[1]),`DN${f[1]} (${f[0]}″) — Ø${f[2]}`]);
const fit=dn=>FIT.find(f=>String(f[1])===String(dn));
T({id:"fittings",cat:"q",sub:"Chizma va ma'lumot",ic:"table",name:"Fitinglar o'lchamlari",
 desc:"Payvandlanadigan fitinglar (ASME B16.9): tirsak, tройник, reduktor va zaglushkaning markazdan uchigacha o'lchami.",
 calc(){return tbl(["DN (dyuym)","Ø, mm","90° uzun","45° uzun","90° qisqa","Tройник","Reduktor","Zaglushka"],FIT.map(f=>[`DN${f[1]} (${f[0]}″)`,fmt(f[2],1),f[3],f[4],f[5],f[6],f[7],f[8]]))
  +note("90° va 45° — tirsak markazidan uchigacha (A, B). Tройник — markazdan uchigacha (C). Reduktor — umumiy uzunlik (H). Taxminiy natija — ishdan oldin fitingni o'lchab tekshiring.")}});

T({id:"single",cat:"q",sub:"Tirsak va offset",ic:"elbow",name:"Bitta tirsak (kesib burchak olish)",quick:0,
 desc:"Tayyor 90° tirsakdan kerakli burchakdagi tirsak kesib olish: tashqi, ichki va o'rta yoy bo'yicha belgilar, tirsak cheki.",
 fields:()=>[{k:"dn",l:"Quvur o'lchami",v:"100",opts:DNOPT,w:1},{k:"ty",l:"Tirsak turi",v:"lr",opts:[["lr","Uzun radius (1,5D)"],["sr","Qisqa radius (1D)"]]},{k:"a",l:"Kerakli burchak",u:"°",v:30}],
 calc(v){const f=fit(v.dn);const Rb=v.ty==="lr"?f[3]:(+f[5]||f[3]*2/3),R=f[2]/2,a=rad(v.a);
  return`<div class="res">${R_("Tirsak cheki (take-out)",fmt(Rb*Math.tan(a/2),1),"mm",1)}${R_("Tashqi yoy bo'yicha belgi",fmt((Rb+R)*a,1),"mm")}${R_("Ichki yoy bo'yicha belgi",fmt((Rb-R)*a,1),"mm")}${R_("O'rta chiziq bo'yicha",fmt(Rb*a,1),"mm")}${R_("Bukish radiusi",fmt(Rb,1),"mm")}</div>`
  +note("Tirsakning bir uchidan tashqi, ichki va yon tomonlarda yoy bo'ylab belgilarni qo'ying, ularni o'rab chiziq bilan tutashtirib kesing. Kesish chizig'i tirsak markaziga yo'nalgan bo'lishi kerak.")}});
const R_=R;

T({id:"teeelbow",cat:"q",sub:"Tirsak va offset",ic:"branch",name:"Tройник + tirsak",
 desc:"Tройникdan chiqib, tirsak bilan nuqtaga borish: ikki quvur bo'lagining kesish uzunligi.",
 fields:()=>[{k:"dn",l:"Quvur o'lchami",v:"50",opts:DNOPT,w:1},{k:"Y",l:"Asosiy quvurdan maqsadgacha (tik)",u:"mm",v:600},{k:"X",l:"Yonga siljish",u:"mm",v:300},{k:"a",l:"Tirsak burchagi",v:"45",opts:ANG},{k:"g",l:"Payvand tirqishi",u:"mm",v:2}],
 calc(v){const f=fit(v.dn);const a=rad(+v.a),C=f[6],A=f[3];const to=A*Math.tan(a/2);const h=v.Y-v.X/Math.tan(a);const L1=h-C-to-2*v.g,L2=v.X/Math.sin(a)-to-v.g;
  return`<div class="res">${R("1-bo'lak (tройникdan tirsakkacha)",fmt(L1,1),"mm",1)}${R("2-bo'lak (tirsakdan keyin, markazgacha)",fmt(L2,1),"mm",1)}${R("Tirsak markazi balandligi",fmt(h,1),"mm")}${R("Tройник C",fmt(C,0),"mm")}${R("Tirsak cheki",fmt(to,1),"mm")}</div>`
  +(L1<0?note("Balandlik yetarli emas — kichikroq burchak yoki kattaroq balandlik kerak.","warn"):"")+note("2-bo'lak uzunligi maqsad nuqtasigacha (u yerda boshqa fiting bo'lsa, uning chekini ham ayiring).")}});

T({id:"reducer",cat:"q",sub:"Belgilash va kesish",ic:"cone",name:"Reduktor yasash (konsentrik/eksentrik)",
 desc:"Listdan quvur reduktori (o'tish) yoyilmasi: markazi bir chiziqda yoki bir tomoni tekis (eksentrik). DXF bilan.",
 fields:()=>[{k:"D",l:"Katta diametr",u:"mm",v:219},{k:"d",l:"Kichik diametr",u:"mm",v:114},{k:"L",l:"Uzunlik",u:"mm",v:200},{k:"ty",l:"Turi",v:"c",opts:[["c","Konsentrik"],["e","Eksentrik (bir tomoni tekis)"]]},{k:"t",l:"Qalinlik",u:"mm",v:3},{k:"m",l:"O'lchamlar",v:"o",opts:DIMT}],
 calc(v){const R0=neu(v.D,v.t,v.m)/2,r0=neu(v.d,v.t,v.m)/2,e=v.ty==="e"?R0-r0:0,N=48;const P={},tr=[];
  for(let k=0;k<=N;k++){const f=PI+2*PI*k/N;P["B"+k]=[R0*Math.cos(f),R0*Math.sin(f),0];P["T"+k]=[e+r0*Math.cos(f),r0*Math.sin(f),v.L]}
  for(let k=0;k<N;k++){tr.push(["B"+k,"T"+k,"B"+(k+1)],["T"+k,"B"+(k+1),"T"+(k+1)])}
  const {pos}=unfold(P,tr);const bot=[],top=[];for(let k=0;k<=N;k++){bot.push(pos["B"+k]);top.push(pos["T"+k])}
  const sh={cut:[[[...bot,...top.reverse()],true]],bend:[0,6,12,18,24,30,36,42,48].map(k=>[pos["B"+k],pos["T"+k]])};const b=bbox(sh);
  return{html:`<div class="res">${R("List o'lchami (taxm.)",`${fmt0(b[2]-b[0])} × ${fmt0(b[3]-b[1])}`,"mm",1)}${R("Siljish (eksentrik)",fmt(e,1),"mm")}${R("Og'irlik (po'lat)",fmt(area(sh.cut[0][0])*v.t*7.85e-6,2),"kg")}</div><div class="svgbox">${svgOf(sh)}</div>${shapeButtons()}${note("Chok katta tomonda joylashgan. Eksentrik reduktorda tekis tomon — chokka qarama-qarshi tomon.")}`,
   shape:sh,name:`reduktor_${v.D}x${v.d}`,mesh:trisMesh(P,tr,0)}}});

T({id:"elbranch",cat:"q",sub:"Belgilash va kesish",ic:"branch",name:"Tirsakka vrezka shabloni",
 desc:"Tirsakning tashqi yoki yon tomoniga quvur ulash uchun kesish shabloni (sonli hisob bilan).",
 fields:()=>[{k:"dn",l:"Tirsak o'lchami",v:"150",opts:DNOPT,w:1},{k:"d",l:"Tarmoq quvur diametri",u:"mm",v:60.3},{k:"pos",l:"Joyi",v:"o",opts:[["o","Tashqi tomon (yoy o'rtasi)"],["s","Yon tomon"]]},{k:"u",l:"Tirsak burchagidagi joyi",u:"°",v:45},{k:"n",l:"Bo'laklar",v:"16",opts:[["8","8"],["16","16"],["24","24"]]}],
 calc(v){const f=fit(v.dn),Rb=f[3],R0=f[2]/2,r=v.d/2,u0=rad(v.u);if(r>R0)return{html:note("Tarmoq quvur tirsakdan katta bo'lmasin.","warn")};
  const O=[Rb*Math.cos(u0),Rb*Math.sin(u0),0],rd=[Math.cos(u0),Math.sin(u0),0],tg=[-Math.sin(u0),Math.cos(u0),0],zz=[0,0,1];
  const ax=v.pos==="o"?rd:zz,e1=v.pos==="o"?zz:rd,e2=tg;
  const F=q=>{const rr=Math.hypot(q[0],q[1])-Rb;return rr*rr+q[2]*q[2]-R0*R0};
  const Q=(t,ph)=>[0,1,2].map(i=>O[i]+t*ax[i]+r*(Math.cos(ph)*e1[i]+Math.sin(ph)*e2[i]));
  const tOf=ph=>{let hi=R0*2+r,lo=hi;while(lo>-R0*2&&F(Q(lo,ph))>0)lo-=0.5;if(lo<=-R0*2)return NaN;for(let i=0;i<40;i++){const m=(lo+hi)/2;F(Q(m,ph))>0?hi=m:lo=m}return(lo+hi)/2};
  const M=144,ts=[];for(let i=0;i<=M;i++)ts.push(tOf(2*PI*i/M));if(ts.some(isNaN))return{html:note("Bu joyda quvur tirsakka to'liq tushmaydi — o'lchamni tekshiring.","warn")};
  const mn=Math.min(...ts),mx=Math.max(...ts),C=2*PI*r,top=mx-mn+40;const pts=ts.map((t,i)=>[r*2*PI*i/M,t-mn]);
  const sh={cut:[[[...pts,[C,top],[0,top]],true]],bend:[]};const N=+v.n,rows=[];for(let k=0;k<N;k++){const i=Math.round(k*M/N);rows.push([k+1,fmt(pts[i][0],1),fmt(pts[i][1],1)]);sh.bend.push([pts[i],[pts[i][0],top]])}
  const Mb={tris:[],cols:MC};const UA=rad(90);quadMesh([...Array(19)].map((_,i)=>{const uu=UA*i/18;const row=[];for(let j=0;j<=36;j++){const vv=2*PI*j/36;const rr=Rb+R0*Math.cos(vv);row.push([rr*Math.cos(uu),rr*Math.sin(uu),R0*Math.sin(vv)])}return row}),1,Mb);
  const Lb=mx+R0*1.2;quadMesh([0,1,2,3,4].map(s=>{const row=[];for(let i=0;i<=M;i+=4){const t=ts[i]+(Lb-ts[i])*s/4;row.push(Q(t,2*PI*i/M))}return row}),0,Mb);
  return{html:`<div class="res">${R("Shablon uzunligi",fmt(C,1),"mm",1)}${R("Egar chuqurligi",fmt(mx-mn,1),"mm")}${R("Tirsak radiusi",fmt(Rb,0),"mm")}</div><div class="svgbox">${svgOf(sh)}</div>${shapeButtons()}${tbl(["№","Aylana bo'yicha, mm","Balandlik, mm"],rows)}`,shape:sh,name:`tirsak_vrezka_DN${v.dn}_${v.d}`,mesh:Mb}}});

T({id:"tubebend",cat:"q",sub:"Belgilash va kesish",ic:"bend",name:"Trubani bukish (trubagib)",
 desc:"Bir necha bukishli truba: kesish uzunligi va har bir bukish boshlanadigan belgi.",
 fields:()=>[{k:"L",l:"To'g'ri qismlar (kesishgan nuqtalar orasi, vergul bilan)",v:"300, 500, 300",t:"text",w:1},{k:"A",l:"Bukish burchaklari (vergul bilan)",v:"90, 90",t:"text",w:1},{k:"R",l:"Bukish radiusi (CLR)",u:"mm",v:60}],
 calc(v){const L=String(v.L).split(/[,;\s]+/).map(Number).filter(x=>x>0),A=String(v.A).split(/[,;\s]+/).map(Number).filter(x=>x>0);
  if(A.length!==L.length-1)return note("Burchaklar soni to'g'ri qismlardan bitta kam bo'lsin.","warn");
  const Tn=A.map(a=>v.R*Math.tan(rad(a)/2)),arc=A.map(a=>v.R*rad(a));let pos=0;const rows=[];
  for(let i=0;i<A.length;i++){const straight=L[i]-(i>0?Tn[i-1]:0)-Tn[i];pos+=straight;rows.push([i+1,fmt(A[i],0)+"°",fmt(pos,1),fmt(pos+arc[i],1)]);pos+=arc[i]}
  const last=L[L.length-1]-Tn[Tn.length-1];const total=pos+last;
  return`<div class="res">${R("Kesish uzunligi",fmt(total,1),"mm",1)}${R("Bukishlar soni",A.length)}${R("Tejalish (yig'indi)",fmt(L.reduce((s,x)=>s+x,0)-total,1),"mm")}</div>`+tbl(["Bukish","Burchak","Boshlanish belgisi, mm","Tugash, mm"],rows)+note("Belgilar truba boshidan o'lchanadi. Bukilgandan keyin truba biroz orqaga qaytadi (springback) — 1–3° ortiqcha buking.")}});

/* Flanetslar EN 1092-1 PN16: DN, D, K, boltlar soni, M, qalinlik (taxm.) */
const FLG=[[15,95,65,4,12,16],[20,105,75,4,12,18],[25,115,85,4,12,18],[32,140,100,4,16,18],[40,150,110,4,16,18],[50,165,125,4,16,18],[65,185,145,8,16,18],[80,200,160,8,16,20],[100,220,180,8,16,20],[125,250,210,8,16,22],[150,285,240,8,20,22],[200,340,295,12,20,24],[250,405,355,12,24,26],[300,460,410,12,24,28],[350,520,470,16,24,30],[400,580,525,16,27,32]];
const TQ={12:79,16:195,20:380,24:660,27:970},PITCH={12:1.75,16:2,20:2.5,24:3,27:3};
const ORDER=n=>{const o={4:[1,3,2,4],8:[1,5,3,7,2,6,4,8],12:[1,7,4,10,2,8,5,11,3,9,6,12],16:[1,9,5,13,3,11,7,15,2,10,6,14,4,12,8,16]};return o[n]||[...Array(n)].map((_,i)=>i+1)};
const pipeOD=dn=>{const f=FIT.find(x=>x[1]===dn);const g=PIPES.find(p=>p[0]===dn);return g?g[2]:f?f[2]:dn};
T({id:"flbolt",cat:"q",sub:"Flanetslar",ic:"gauge",name:"Flanets boltlari",
 desc:"PN16 flanets: boltlar soni va o'lchami, bolt uzunligi, tortish momenti va tartibi. Tekis flanets DXF (lazer uchun).",
 fields:()=>[{k:"dn",l:"Flanets DN",v:"100",opts:FLG.map(f=>[String(f[0]),"DN"+f[0]]),w:1},{k:"g",l:"Prokladka qalinligi",u:"mm",v:3},{k:"t",l:"Flanets qalinligi (0 — jadvaldan)",u:"mm",v:0}],
 calc(v){const f=FLG.find(x=>String(x[0])===String(v.dn));const [dn,D,K,n,M]=f;const t=v.t>0?v.t:f[5];const hole=M+(M>=27?3:2);
  const Lb=Math.ceil((2*t+v.g+0.8*M+3*PITCH[M])/5)*5;const od=pipeOD(dn);
  const sh={circ:[[0,0,D/2],[0,0,od/2+0.5],...[...Array(n)].map((_,i)=>{const a=2*PI*i/n+PI/n;return[K/2*Math.cos(a),K/2*Math.sin(a),hole/2]})]};
  return{html:`<div class="res">${R("Boltlar",`${n} × M${M}`,"",1)}${R("Bolt uzunligi (gayka bilan)",fmt0(Lb),"mm")}${R("Tortish momenti (8.8, moylangan)",`≈ ${fmt0(TQ[M]*0.7)}–${fmt0(TQ[M])}`,"N·m")}${R("Teshik diametri",fmt0(hole),"mm")}${R("Boltlar aylanasi K",fmt0(K),"mm")}${R("Tashqi diametr D",fmt0(D),"mm")}</div>
   <h3 class="sec">Tortish tartibi (yulduzcha)</h3><div class="card" style="font-size:18px;font-weight:700;letter-spacing:1px">${ORDER(n).join(" → ")}</div>
   <div class="svgbox">${svgOf(sh)}</div>${shapeButtons()}${note("Boltlarni 3 bosqichda torting: 30% → 70% → 100%, har safar yulduzcha tartibida, oxirida aylana bo'yicha bir marta tekshiring. Moment prokladka turiga qarab o'zgaradi — prokladka ishlab chiqaruvchisi ko'rsatmasiga amal qiling.")}`,shape:sh,name:`flanets_PN16_DN${dn}`}}});

T({id:"flgasket",cat:"q",sub:"Flanetslar",ic:"cyl",name:"Flanets prokladkasi",
 desc:"PN16 flanets uchun prokladka o'lchamlari: ichki (boltlar ichida) yoki to'liq yuzali (teshikli). DXF — lazer yoki plotterda kesish uchun.",
 fields:()=>[{k:"dn",l:"Flanets DN",v:"100",opts:FLG.map(f=>[String(f[0]),"DN"+f[0]]),w:1},{k:"ty",l:"Turi",v:"i",opts:[["i","Boltlar ichida (IBC)"],["f","To'liq yuzali (teshikli)"]]}],
 calc(v){const f=FLG.find(x=>String(x[0])===String(v.dn));const [dn,D,K,n,M]=f;const hole=M+(M>=27?3:2);const id=pipeOD(dn)+1;const od=v.ty==="i"?K-hole:D;
  const sh={circ:[[0,0,od/2],[0,0,id/2]]};if(v.ty==="f")for(let i=0;i<n;i++){const a=2*PI*i/n+PI/n;sh.circ.push([K/2*Math.cos(a),K/2*Math.sin(a),hole/2])}
  return{html:`<div class="res">${R("Tashqi diametr",fmt0(od),"mm",1)}${R("Ichki diametr",fmt0(id),"mm")}${v.ty==="f"?R("Teshiklar",`${n} × Ø${hole}`)+R("Teshiklar aylanasi",fmt0(K),"mm"):""}</div><div class="svgbox">${svgOf(sh)}</div>${shapeButtons()}`,shape:sh,name:`prokladka_DN${dn}_${v.ty}`}}});

T({id:"bank",cat:"q",sub:"Chizma va ma'lumot",ic:"offset",name:"Parallel quvurlar (pipe bank)",
 desc:"Bir nechta parallel quvur birga offset qilinganda har bir quvur offseti qancha oldin/keyin boshlanishi.",
 fields:()=>[{k:"n",l:"Quvurlar soni",v:4},{k:"S",l:"Quvurlar orasi (markazdan)",u:"mm",v:200},{k:"a",l:"Offset burchagi",v:"45",opts:ANG},{k:"H",l:"Offset (siljish)",u:"mm",v:500}],
 calc(v){const a=rad(+v.a),k=v.S*Math.tan(a/2),n=Math.max(1,Math.round(v.n));const rows=[];for(let i=0;i<n;i++)rows.push([i+1,fmt(i*k,1),fmt(v.H/Math.sin(a),1)]);
  return`<div class="res">${R("Har keyingi quvur siljishi",fmt(k,1),"mm",1)}${R("Qiya uzunlik (barchasida)",fmt(v.H/Math.sin(a),1),"mm")}</div>`+tbl(["Quvur","Boshlanishi siljiydi, mm","Qiya uzunlik, mm"],rows)+note("1-quvur — burilishning ichki tomonidagisi. Har bir keyingi quvurning offset boshlanishi va tugashi ko'rsatilgan masofaga suriladi, shunda quvurlar orasi bir xil qoladi.")}});

T({id:"jacket",cat:"q",sub:"Chizma va ma'lumot",ic:"cyl",name:"G'ilofli quvur (truba ichida truba)",
 desc:"Ichki quvur g'ilof (tashqi quvur) ichida: oraliq, markazlash tayanchi balandligi va oraliq hajmi.",
 fields:()=>[{k:"d",l:"Ichki quvur tashqi diametri",u:"mm",v:57},{k:"D",l:"G'ilof tashqi diametri",u:"mm",v:108},{k:"t",l:"G'ilof devori",u:"mm",v:4},{k:"L",l:"Uzunlik",u:"m",v:6}],
 calc(v){const Di=v.D-2*v.t,gap=(Di-v.d)/2;const A=PI*(Di*Di-v.d*v.d)/4/1e6;
  return`<div class="res">${R("Oraliq (har tomondan)",fmt(gap,1),"mm",1)}${R("Tayanch balandligi",fmt(gap-1,1),"mm")}${R("Oraliq hajmi 1 m",fmt(A*1000,2),"l/m")}${R("Jami oraliq hajmi",fmt(A*1000*v.L,1),"litr")}${R("Tayanchlar oralig'i (taxm.)",fmt0(Math.min(3000,Math.max(1000,v.d*25))),"mm")}</div>`
  +(gap<5?note("Oraliq juda kichik — suyuqlik yaxshi aylanmaydi.","warn"):"")+note("Markazlash tayanchlarini aylanaga 3–4 tadan (120° yoki 90°) payvandlang, tayanch balandligi oraliqdan 1 mm kam bo'lsin.")}});

     <h3 class="sec">Yozuvlar (${L.length})</h3>${L.length?L.map((r,i)=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(r[fields[0].k]||"")}</b><button class="btn" style="flex:none;min-width:0;padding:6px 12px" data-x="${i}">✕</button></div><div class="desc" style="margin:6px 0 0">${fields.slice(1).map(f=>`${esc(f.l)}: <b style="color:var(--tx)">${esc(r[f.k]??"")}</b>`).join(" · ")}</div></div>`).join(""):`<div class="empty">Hali yozuv yo'q</div>`}`;
    root.querySelector("#add").onclick=()=>{const v=readVals(root,fields.map(f=>({...f,t:"text"})));L.unshift(v);store.set(key,L);toast("Yozuv qo'shildi");this.render(root)};

}

T({id:"shell",cat:"y",sub:"Yoyilmalar",ic:"cyl",name:"Bak / rezervuar obechaykasi",

  const sh={cut:[],bend:[]};for(let r=0;r<rows;r++){const y0=r*v.pw,h=r===rows-1?lastW:v.pw,off=(r%2)*v.pl/2;let x=-off;sh.cut.push([[[0,y0],[C,y0],[C,y0+h],[0,y0+h]],true]);
    for(let k=1;k<=n+1;k++){x+=v.pl;if(x>0&&x<C)sh.bend.push([[x,y0],[x,y0+h]])}}
  return{html:`<div class="res">${R("Yoyilma uzunligi (aylana)",fmt(C,0),"mm",1)}${R("Qatorlar soni",rows)}${R("Har qatorda listlar",`${n} (oxirgisi ${fmt0(last)} mm)`)}${R("Oxirgi qator eni",fmt0(lastW),"mm")}${R("Devor og'irligi",fmt(kg,0),"kg")}${R("Kerakli listlar (taxm.)",Math.ceil(C*v.H/(v.pl*v.pw)))}</div><div class="svgbox">${svgOf(sh)}</div>${shapeButtons()}`
   +note("Ko'k chiziqlar — tik choklar. Qo'shni qatorlarning tik choklari yarim listga surilgan (bir chiziqda bo'lmasligi kerak, kamida 5×qalinlik)."),shape:sh,name:`bak_${v.D}x${v.H}`,mesh:(()=>{const M={tris:[],cols:MC};revMesh([[v.D/2,0],[v.D/2,v.H]],0,M);return M})()}}});

T({id:"elements",cat:"y",sub:"Belgilash",ic:"cyl",name:"Element chiziqlari (qiya kesik)",

  const sh={cut:[[[[0,0],...pts.map(p=>p).slice(0,1).map(()=>[0,0]),[C,0],...pts.reverse()],true]],bend:[]};const rows=[];for(let k=0;k<N;k++){const f=2*PI*k/N;rows.push([k+1,fmt(r*f,1),fmt(Lf(f),1)]);sh.bend.push([[r*f,0],[r*f,Lf(f)]])}
  const Me={tris:[],cols:MC};quadMesh([0,1].map(s=>{const row=[];for(let j=0;j<=48;j++){const f=2*PI*j/48;row.push([r*Math.cos(f),r*Math.sin(f),s?Lf(f):0])}return row}),0,Me);
  return{html:`<div class="res">${R("Eng uzun tomon",fmt(Lf(PI),1),"mm",1)}${R("Shablon uzunligi",fmt(C,1),"mm")}${R("Kesik ellips uzun o'qi",fmt(v.D/Math.cos(rad(v.a)),1),"mm")}</div><div class="svgbox">${svgOf(sh)}</div>${shapeButtons()}${tbl(["№","Aylana bo'yicha, mm","Uzunlik, mm"],rows)}`,shape:sh,name:`qiya_kesik_${v.D}_${v.a}`,mesh:Me}}});
