plugins { id 'com.android.application' }
android {
    namespace 'uz.jarvis.xabar'
    compileSdk 34
    defaultConfig {
        applicationId 'uz.jarvis.xabar'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('RUN') ?: '1')
        versionName "1.0." + (System.getenv('RUN') ?: '1')
    }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
